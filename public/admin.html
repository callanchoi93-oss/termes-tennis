<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>맞수 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 맞수 앱과 같은 눈금을 쓴다 — 글자 8.7·11·14·18·23·29, 여백 4·6·10·17·27.
   예전 admin 은 글자 크기가 14가지에 굵기가 대부분 800~900 이라
   무엇이 중요한지 안 보였다. 본문은 400~500, 강조만 600~700 으로 둔다. */
:root{
  --ink:#1c1b18; --ink2:#3a352d; --gray:#7d7870; --lgray:#a8a29a;
  --coral:#ec6a2e; --coral-d:#cf5418; --gold:#e09a2b; --gold-bg:#fdf6ea;
  --line:#eae6dd; --paper:#faf8f5; --red:#c14545;
  --t0:8.7px; --t1:11px; --t2:14px; --t3:18px; --t4:23px; --t5:29px;
  --s1:4px; --s2:6px; --s3:10px; --s4:17px; --s5:27px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
  letter-spacing:-.018em;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:var(--s4) var(--s3) 60px;word-break:keep-all}
.wrap{max-width:680px;margin:0 auto}
.hd{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s4)}
.hd h1{font-size:var(--t4);font-weight:700;letter-spacing:-.04em}
.hd .who{font-size:var(--t1);color:var(--lgray);font-weight:500;margin-left:auto}
.segs{display:flex;gap:2px;background:#f1eee7;border-radius:12px;padding:3px;margin-bottom:var(--s3)}
.seg{flex:1;text-align:center;padding:7px 2px;border-radius:9px;font-size:var(--t1);
  font-weight:500;color:var(--gray);cursor:pointer;white-space:nowrap;transition:.12s}
.seg.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(27,24,19,.08)}
.more{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.more span{font-size:var(--t1);color:var(--gray);font-weight:500;cursor:pointer;
  padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--line)}
.more span.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.card{background:#fff;border-radius:16px;padding:var(--s3) var(--s4) var(--s4);
  box-shadow:0 1px 2px rgba(40,30,18,.04);margin-bottom:var(--s3)}
.card.flat{padding:var(--s4)}
.ct{font-size:var(--t2);font-weight:600;letter-spacing:-.02em;margin-bottom:var(--s2)}
.rw{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid #f4f1ea}
.rw:first-child{border-top:0}
.nm{flex:1;min-width:0}
.nm b{display:flex;align-items:baseline;gap:var(--s2);font-size:var(--t2);font-weight:600;
  letter-spacing:-.02em;min-width:0}
.nm b > .tag{margin-left:0;flex:none}
.nm span{display:block;font-size:var(--t1);color:var(--lgray);font-weight:500;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:var(--t0);font-weight:600;border-radius:20px;padding:2px 7px;
  background:#f4f1ea;color:var(--gray);margin-left:var(--s2);vertical-align:1px;white-space:nowrap}
.tag.f{background:#fdeef4;color:#c94378} .tag.m{background:#eaf2ff;color:#2b62c9}
/* 가입 경로 — 각 서비스 색을 옅게 빌려 쓴다. 성별 딱지와 나란히 놓여도 안 헷갈린다. */
.tag.k{background:#fef4d4;color:#8a6a12} .tag.a{background:#f0eeec;color:#3a352d}
.tag.go{background:#eef3fb;color:#3b6bb5}
.tag.o{background:#fceee4;color:var(--coral-d)} .tag.g{background:#edf2ec;color:#4c7a5c}
.seg3{display:flex;gap:3px;flex:none}
.b{font-size:var(--t1);font-weight:500;border-radius:9px;padding:5px 10px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--gray);font-family:inherit}
.b.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.b.dz{border-color:#f0dcdc;color:var(--red)}
.b:active{transform:scale(.97)}
.warn{display:flex;align-items:center;gap:var(--s2);background:var(--gold-bg);border-radius:12px;
  padding:var(--s3) var(--s4);margin-bottom:var(--s3);font-size:var(--t1);color:#8a6a3a;font-weight:500}
.warn b{color:#7a5a1a;font-weight:700}

.srch{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
.srch input{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 12px;

.srch input:focus{outline:0;border-color:var(--coral)}
.srch button{border:0;border-radius:12px;padding:0 var(--s4);background:var(--ink);color:#fff;
  font-size:var(--t1);font-weight:600;font-family:inherit;cursor:pointer}
.kpi{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
.kpi div{flex:1;background:#fff;border-radius:14px;padding:var(--s3) var(--s2);text-align:center;
  box-shadow:0 1px 2px rgba(40,30,18,.04)}
.kpi b{display:block;font-size:var(--t3);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:var(--t1);color:var(--lgray);font-weight:500;margin-top:1px}
.empty{text-align:center;color:var(--lgray);font-size:var(--t1);font-weight:500;padding:var(--s5) 0}

  .fld{flex:1;min-width:0;margin-bottom:var(--s2)}
  .fld label{display:block;font-size:11px;font-weight:600;color:var(--g2,#8a857c);margin-bottom:4px}
  .fld input,.fld select{width:100%;padding:9px 11px;border:1px solid var(--ln,#e6e3dd);
    border-radius:10px;font-size:13px;font-family:inherit;background:#fff;color:inherit;
    -webkit-appearance:none;appearance:none}
  .fld input:focus,.fld select:focus{outline:none;border-color:#e0a06a}
  .frow{display:flex;gap:var(--s2)}
  .slots{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
  .slot{display:flex;align-items:center;gap:8px;border:1px solid var(--ln,#e6e3dd);border-radius:12px;
    padding:10px 12px;cursor:pointer;background:#fff}
  .slot.on{border-color:#e0a06a;background:#fdf3ea}
  .slot b{font-size:13px;font-weight:700;flex:none}

.note{font-size:var(--t1);color:var(--lgray);font-weight:500;line-height:1.65;margin-top:var(--s2)}
.gate{max-width:340px;margin:60px auto}
.gate h2{font-size:var(--t3);font-weight:700;margin-bottom:var(--s2)}
.gate p{font-size:var(--t1);color:var(--gray);font-weight:500;margin-bottom:var(--s4)}
.gate input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  font-size:var(--t2);font-family:inherit;font-weight:500;margin-bottom:var(--s2)}
.gate button{width:100%;border:0;border-radius:12px;padding:12px;background:var(--ink);color:#fff;
  font-size:var(--t2);font-weight:600;font-family:inherit;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:#fff;
  font-size:var(--t1);font-weight:500;padding:10px 16px;border-radius:20px;opacity:0;
  transition:.2s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.sk{background:#f4f1ea;border-radius:8px;height:12px;animation:p 1.2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
  /* 마지막 접속 — 색으로 최근인지 오래됐는지 바로 읽히게 */
  /* 접속 색 — 어디에 붙어도 먹도록 클래스 하나로 둔다 */
  .now{color:#1f7d4d}
  .wk{color:#cf5418}
  .mo{color:#8a8378}
  .old{color:#c2410c}
  .unk{color:#c9c3b8}
  .rt{font-size:11px;color:#b3aea4}
  .kpi3{display:flex;gap:8px;margin-top:10px}
  .kpi3>div{flex:1;text-align:center;background:var(--cream2,#f6f5f2);border-radius:12px;padding:12px 4px}
  .kpi3 b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em}
  .kpi3 b.warn{color:#c2410c}
  .kpi3 i{font-style:normal;display:block;font-size:11px;color:#b3aea4;margin-top:4px}
  .prow{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:13px}
  .prow .l{width:56px;font-weight:600}
  .prow .t{flex:1;height:8px;background:#f2f1ec;border-radius:5px;overflow:hidden}
  .prow .t i{display:block;height:100%;background:#ec6a2e;border-radius:5px}
  .prow .v{width:70px;text-align:right;font-weight:700}
  .prow .v em{font-style:normal;font-size:11px;color:#b3aea4;margin-left:5px;font-weight:500}
  /* ── 회원 목록 ── 줄마다 버튼 네 개가 달려 있으면 정작 봐야 할 게 안 보인다.
     얼굴로 줄을 나누고, 접속은 오른쪽 한 자리에 몰고, 손대는 일은 눌러 들어간 곳으로. */

  .fchip{border:1px solid var(--line,#ececea);border-radius:20px;padding:6px 13px;
    font-size:12px;font-weight:600;color:#57503f;cursor:pointer;white-space:nowrap}
  .fchip em{font-style:normal;color:#b3aea4;margin-left:3px}
  .fchip.on{background:#161412;color:#fff;border-color:#161412}
  .fchip.on em{color:rgba(255,255,255,.6)}
  .fchip.w{border-color:#f3d9c5;background:#fffaf6;color:#cf5418;font-weight:700}
  .fchip.w em{color:#cf5418}
  .fchip.w.on{background:#161412;color:#fff;border-color:#161412}
  .urw{display:flex;align-items:center;gap:12px;padding:13px 4px;
    border-bottom:1px solid #f4f2ed;cursor:pointer}
  .urw:last-child{border-bottom:0}
  /* 줄 전체를 흐리게 하면 목록이 통째로 죽는다.

  .urw.gone .us{color:#c9c3b8}
  .av{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:13px;font-weight:700}
  .ub{flex:1;min-width:0}
  .ut{display:flex;align-items:center}
  .ut b{font-size:14.5px;font-weight:700;letter-spacing:-.03em;margin-right:8px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
  .ut i{font-style:normal;font-size:9.5px;font-weight:700;white-space:nowrap}
  .ut i.m{color:#2b62c9}.ut i.f{color:#c94378}
  .ut i.p{color:#b3aea4;font-weight:500}
  .ut i.none{background:#fceee4;color:#cf5418;border-radius:5px;padding:2px 6px}
  .ut s{text-decoration:none;font-size:9.5px;color:#d6d2ca;margin:0 5px}
  .us{display:block;font-size:10.5px;color:#b3aea4;margin-top:3px}
  .usn{text-align:right;flex:none}

  .urw .go{flex:none;color:#d6d2ca;font-size:14px}
  /* 회원 상세 */
  .ov{position:fixed;inset:0;background:rgba(20,16,12,.4);display:none;
    align-items:flex-end;justify-content:center;z-index:60}
  .ov.on{display:flex}
  .sheet{width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;
    padding:20px 18px 30px;max-height:86vh;overflow:auto}
  .sh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sh-top h3{font-size:20px;font-weight:700;letter-spacing:-.04em}
  .sh-top .cl{font-size:22px;color:#b3aea4;cursor:pointer;padding:0 6px}
  .ur{display:flex;justify-content:space-between;align-items:center;
    padding:12px 2px;border-bottom:1px solid #f4f2ed;font-size:13px}
  .ur span{color:#7d7870}
  .ur b{font-weight:700}
  .unote{font-size:11px;color:#b3aea4;line-height:1.6;padding:10px 2px 0}
  .ul{font-size:10.5px;font-weight:700;color:#b3aea4;letter-spacing:.08em;margin:18px 0 8px}
  .useg{display:flex;gap:6px}
  .useg b{flex:1;text-align:center;border:1px solid var(--line,#ececea);border-radius:11px;
    padding:12px 0;font-size:13px;font-weight:600;color:#57503f;cursor:pointer}
  .useg b.on{background:#161412;color:#fff;border-color:#161412}
  .uact{display:flex;flex-direction:column;gap:8px;margin-top:20px}
  .uact button{border:1px solid var(--line,#ececea);background:#fff;border-radius:12px;
    padding:14px 0;font-size:13px;font-weight:600;color:#57503f;font-family:inherit;cursor:pointer}
  .uact button.danger{color:#c2410c;border-color:#f3d9c5}
  /* 분석 */
  .ct{font-size:13px;font-weight:700;letter-spacing:-.03em;padding:4px 2px 10px}
  .tbar{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:12.5px}
  .tbar .l{width:96px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbar .t{flex:1;height:9px;background:#f2f1ec;border-radius:5px;overflow:hidden}
  .tbar .t i{display:block;height:100%;border-radius:5px}
  .tbar .v{width:86px;text-align:right;font-weight:700}
  .tbar .v em{font-style:normal;font-size:10.5px;color:#b3aea4;margin-left:5px;font-weight:500}
  .fstep{padding:9px 2px}
  .fl{display:flex;align-items:center;gap:8px}
  .fl b{font-size:13px;font-weight:700}
  .fl em{font-style:normal;font-size:11px;font-weight:700;color:#b3aea4}
  .fl em.bad{color:#c2410c}
  .ft{height:10px;background:#f2f1ec;border-radius:5px;overflow:hidden;margin:6px 0 4px}
  .ft i{display:block;height:100%;background:#ec6a2e;border-radius:5px}
  .fn{font-size:11.5px;color:#7d7870}
  .fn span{color:#b3aea4;margin-left:4px}
  /* 교류전 테스트 */
  .xrw{padding:14px 4px;border-bottom:1px solid #f2f0ea}
  .xrw:last-child{border-bottom:0}

<script>
const $=id=>document.getElementById(id);
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on');
  clearTimeout(window._tt); window._tt=setTimeout(()=>e.classList.remove('on'),2200); }
function key(){ return localStorage.getItem('matsu_admin_key')||''; }
async function api(path, opts){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','x-admin-key':key(),...((opts&&opts.headers)||{})}});
  if(!r.ok){ const t=await r.text().catch(()=>String(r.status)); throw new Error(t); }
  return r.json();
}
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const ymd=t=>{ if(!t) return ''; const d=new Date(t); if(isNaN(d)) return '';
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };
/* 마지막 접속 — 날짜보다 <얼마나 전인지>가 관리에 쓸모 있다.
   오늘 들어온 사람과 두 달 전에 끊긴 사람을 한눈에 갈라야 하기 때문이다. */
const TIER_MIN=2;
/* 실제 시각 — 상대 시간만으로는 <언제부터 끊겼나>를 알 수 없다.
   특정 날 이후로 다 끊겼다면 그날 무슨 일이 있었다는 뜻이다. */
const stamp=t=>{ const d=new Date(t); if(isNaN(d)) return '';
  const p=n=>String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };                 // 서버의 TIER_MIN_GAMES 와 같은 값
const ago=t=>{
  /* 기록을 켠 날 이전에 다녀간 사람은 값이 없다 — <안 온 사람>과 뜻이 다르다 */
  if(!t) return {txt:'아직 모름', cls:'unk'};
  const m=Math.floor((Date.now()-t)/60000);
  if(m<1)    return {txt:'방금',        cls:'now'};
  if(m<60)   return {txt:`${m}분 전`,   cls:'now'};
  const h=Math.floor(m/60);
  if(h<24)   return {txt:`${h}시간 전`, cls:'now'};
  const d=Math.floor(h/24);
  if(d===1)  return {txt:'어제',        cls:'wk'};
  if(d<7)    return {txt:`${d}일 전`,   cls:'wk'};
  if(d<30)   return {txt:`${Math.floor(d/7)}주 전`, cls:'mo'};
  if(d<365)  return {txt:`${Math.floor(d/30)}개월 전`, cls:'old'};
  return {txt:'1년 이상', cls:'old'};
};

/* 탭 14개를 9개로 묶었다. 구장 관련 넷(구장·예약·열린 시간·정산)은 한 화면에서
   안쪽 탭으로 나누고, 매치와 인원 미달, 계정과 매니저 등급도 함께 본다.
   가로로 흐르던 14개는 뒤쪽에 무엇이 있는지 알 수 없었다. */
const MAIN=[['stats','현황'],['users','회원'],['clubs','클럽'],['matches','매치']];
const MORE=[['track','분석'],['xctest','교류전'],['venues','구장'],['reports','신고'],
  ['payouts','정산'],['staff','계정'],['banners','배너']];
let TAB='stats', SUB='', UQ='', SEL=null, CACHE={};

function gLabel(v){ const t=String(v||'').trim();
  if(!t) return '';
  return (t==='F'||t.startsWith('여')) ? '여성' : (t==='M'||t.startsWith('남')) ? '남성' : ''; }

function shell(inner){
  const seg=MAIN.map(([k,l])=>`<div class="seg ${TAB===k?'on':''}" onclick="go('${k}')">${l}</div>`).join('');
  const more=MORE.map(([k,l])=>`<span class="${TAB===k?'on':''}" onclick="go('${k}')">${l}</span>`).join('');
  return `<div class="hd"><h1>맞수 관리자</h1><span class="who">${esc(key().slice(0,4))}···</span></div>
    <div class="segs">${seg}</div><div class="more">${more}</div>${inner}`;
}
function go(k){ TAB=k; SUB=''; render(); }
function subTabs(list){
  return `<div class="more">${list.map(([k,l])=>
    `<span class="${(SUB||list[0][0])===k?'on':''}" onclick="SUB='${k}';render()">${l}</span>`).join('')}</div>`;
}
function skel(n){ return `<div class="card">${Array.from({length:n||3},()=>
  `<div class="rw"><div class="nm"><div class="sk" style="width:38%"></div>
   <div class="sk" style="width:62%;height:9px;margin-top:6px"></div></div></div>`).join('')}</div>`; }

async function render(){
  if(!key()){ $('app').innerHTML=`<div class="gate"><h2>관리자 열쇠</h2>
      <p>서버에 설정한 관리자 키를 넣어주세요.</p>
      <input id="k" type="password" placeholder="admin key" onkeydown="if(event.key==='Enter')saveKey()">
      <button onclick="saveKey()">들어가기</button></div>`; return; }
  $('app').innerHTML=shell(skel(4));
  try{ await draw(); }
  catch(e){ $('app').innerHTML=shell(`<div class="card"><div class="empty">
    불러오지 못했어요<br><span style="font-size:var(--t0)">${esc(String(e.message).slice(0,80))}</span></div></div>`); }
}
async function saveKey(){ const v=($('k')||{}).value||''; if(!v) return;
  localStorage.setItem('matsu_admin_key', v.trim());
  try{ await api('/admin/stats'); toast('접속했어요'); render(); }
  catch(e){ localStorage.removeItem('matsu_admin_key'); toast('열쇠가 맞지 않아요'); render(); } }

async function draw(){
  if(TAB==='stats')   return drawStats();
  if(TAB==='track')   return drawTrack();
  if(TAB==='xctest')  return drawXcTest();
  if(TAB==='users')   return drawUsers();
  if(TAB==='clubs')   return drawClubs();
  if(TAB==='matches') return drawMatches();
  if(TAB==='venues')  return drawVenues();
  if(TAB==='reports') return drawReports();
  if(TAB==='payouts') return drawPayouts();
  if(TAB==='staff')   return drawStaff();
  if(TAB==='banners') return drawBanners();
}

/* ── 현황 ── 숫자만 보여주고 끝나던 화면에 <손볼 것>을 더한다.
   관리자가 여는 이유는 대개 할 일을 찾기 위해서다. */
async function drawStats(){
  /* 알림이 안 올 때 <키·토큰·발송> 중 어디가 문제인지 여기서 바로 본다.
     예전에는 콘솔을 열어 직접 불러와야 했다. */
  const [s, users, reps, push] = await Promise.all([
    api('/admin/stats'), api('/admin/users').catch(()=>[]), api('/admin/reports').catch(()=>[]),
    api('/admin/push-status').catch(()=>null)
  ]);
  const noG=users.filter(u=>!gLabel(u.gender)).length;
  const todo=[];
  if(noG) todo.push(['성별이 빈 회원','대진에서 남복·혼복이 잘못 잡혀요',`${noG}명`,`USEEN='nog';go('users')`]);
  if(reps.length) todo.push(['처리 안 한 신고','확인하고 숨기거나 반려해요',`${reps.length}건`,`go('reports')`]);
  const kpi=[['회원',s.users],['클럽',s.clubs],['오픈매치',s.open_matches!=null?s.open_matches:s.matches]];

  /* ── 살아 있는 앱인지 ──
     총계만 보면 늘고 있는지 줄고 있는지 알 수 없다.
     오늘·이번 주·이번 달 들어온 사람이 진짜 지표다. */
  const live = s.dau==null ? '' : `
    <div class="card"><div class="ct">얼마나 쓰고 있나</div>
      <div class="kpi3">
        <div><b>${fmt(s.dau)}</b><i>오늘 접속</i></div>
        <div><b>${fmt(s.wau)}</b><i>이번 주</i></div>
        <div><b>${fmt(s.mau)}</b><i>이번 달</i></div>
      </div>
      <div class="kpi3">
        <div><b>${fmt(s.newWeek)}</b><i>주간 가입</i></div>
        <div><b class="${s.ghost?'warn':''}">${fmt(s.ghost)}</b><i>가입 후 미접속</i></div>
        <div><b class="${s.dormant?'warn':''}">${fmt(s.dormant)}</b><i>30일 이상 잠듦</i></div>
      </div>
      <div class="note" style="margin-top:8px">
        가입 후 한 번도 안 들어온 사람이 많으면 첫 화면에서 막히는 것이다.<br>
        30일 이상 잠든 사람은 다시 부를 대상이다.</div>
    </div>
    <div class="card"><div class="ct">클럽이 돌아가나</div>
      <div class="kpi3">
        <div><b>${fmt(s.clubsAlive)}</b><i>이번 달 활동 클럽</i></div>
        <div><b>${fmt(s.bracketsMonth)}</b><i>이번 달 대진</i></div>
        <div><b>${fmt(s.exchanges)}</b><i>교류전</i></div>
      </div>
      <div class="note" style="margin-top:8px">
        전체 클럽 ${fmt(s.clubs)}개 중 ${fmt(s.clubsAlive)}개가 이번 달에 모임을 열었어요.
        ${s.clubs>s.clubsAlive ? `나머지 ${fmt(s.clubs-s.clubsAlive)}개는 만들어만 두고 안 쓰는 중이에요.` : ''}</div>
    </div>
    ${(s.byPlat||[]).length ? `<div class="card"><div class="ct">어느 기기로 쓰나</div>
      ${s.byPlat.map(p=>{
        const NM={ios:'아이폰 앱', web:'웹'};
        const tot=s.byPlat.reduce((a,b)=>a+b.n,0)||1;
        const w=Math.round(p.n/tot*100);
        return `<div class="prow"><span class="l">${NM[p.p]||p.p}</span>
          <span class="t"><i style="width:${w}%;background:${p.p==='ios'?'#161412':'#ec6a2e'}"></i></span>
          <span class="v">${fmt(p.n)}<em>${w}%</em></span></div>`; }).join('')}
      <div class="note" style="margin-top:8px">한 번이라도 접속한 회원 기준이에요</div>
    </div>` : ''}
    ${(s.byProvider||[]).length ? `<div class="card"><div class="ct">어디로 가입했나</div>
      ${s.byProvider.map(p=>{
        const NM={kakao:'카카오',google:'구글',apple:'애플',dev:'개발'};
        const w=Math.round(p.n/s.users*100);
        return `<div class="prow"><span class="l">${NM[p.p]||p.p}</span>
          <span class="t"><i style="width:${w}%"></i></span>
          <span class="v">${fmt(p.n)}<em>${w}%</em></span></div>`; }).join('')}
    </div>` : ''}`;
  /* 알림 상태 — 준비됐는지, 폰이 몇 대 붙어 있는지 */
  const ios=push ? ((push.devices||[]).find(d=>d.platform==='ios')||{}).n||0 : 0;
  const web=push ? ((push.devices||[]).find(d=>d.platform==='web')||{}).n||0 : 0;
  const pushBlock = !push ? '' : `
    <div class="card"><div class="ct">알림</div>
      <div class="rw"><div class="nm">
        <b>${push.apns.ready?'보낼 준비가 됐어요':'아직 설정이 덜 됐어요'}
          <span class="tag ${push.apns.ready?'g':''}">${push.apns.ready?'APNs':'미설정'}</span></b>
        <span>${esc(push.apns.bundle_id||'Bundle ID 없음')}${
          push.apns.key_id?` · 키 ${esc(push.apns.key_id)}`:''}</span></div></div>
      <div class="rw"><div class="nm"><b>등록된 기기 ${ios+web}대</b>
        <span>${ios?`아이폰 ${ios}대`:'아이폰 없음 · 앱에서 알림을 허용해야 등록돼요'}${web?` · 웹 ${web}대`:''}</span></div>
        ${ios?'':`<span class="b">확인 필요</span>`}</div>
      ${(()=>{
        /* 진단(diag)과 실제 등록 요청은 나눠 본다 — 섞으면 요약이 엉뚱해진다 */
        const ALL=push.tries||[];
        const T=ALL.filter(t=>t.platform!=='diag');
        const D=ALL.filter(t=>t.platform==='diag');
        if(!T.length && !D.length) return `<div class="rw"><div class="nm"><b>앱이 등록을 시도했나</b>
          <span>아직 한 번도 없어요 · 앱에서 요청 자체가 오지 않았어요</span></div>
          <span class="b">앱 확인</span></div>`;
        /* 도착했는데 저장까지 안 갔으면 <어디서 막혔는지>가 답이다 */
        const done=T.some(t=>t.result==='완료');
        const noAuth=T.some(t=>/로그인 토큰 없음/.test(t.extra||''));
        const t0=T[0];
        const head = !T.length
          ? `<div class="rw"><div class="nm"><b>등록 요청은 아직 없어요</b>
              <span>아래 앱 기록에서 어디서 멈췄는지 보세요</span></div>
              <span class="b">앱 확인</span></div>`
          : `<div class="rw"><div class="nm"><b>${
              done?'등록까지 됐어요':noAuth?'요청은 왔는데 로그인이 안 실려 있어요':'요청은 왔는데 저장이 안 됐어요'}</b>
            <span>${ymd(t0.at)} · ${esc(t0.platform)} · 토큰 ${t0.token_len}자 · ${esc(t0.result)}${
              t0.extra?' ('+esc(t0.extra)+')':''}${T.length>1?` · 시도 ${T.length}회`:''}</span></div>
            ${done?'':`<span class="b">${noAuth?'로그인 확인':'서버 확인'}</span>`}</div>`;
        return head + D.slice(0,4).map(t=>
            `<div class="rw"><div class="nm"><b style="font-weight:500">${esc(t.result)}</b>
              <span>${esc(t.extra||'')}</span></div>
              <span class="b" style="opacity:.6">${ymd(t.at)}</span></div>`).join('');
      })()}
      ${(push.recent||[]).length?`<div class="rw"><div class="nm"><b>최근 등록</b>
        <span>${push.recent.slice(0,3).map(r=>esc(r.name)+' · '+r.platform).join(' / ')}</span></div>
        <button class="b" onclick="go('users')">시험 보내기</button></div>`:''}
    </div>`;
  $('app').innerHTML=shell(`
    <div class="kpi">${kpi.map(([l,v])=>`<div><b>${fmt(v)}</b><span>${l}</span></div>`).join('')}</div>
    ${live+pushBlock}
    ${todo.length?`<div class="warn"><b>손볼 것 ${todo.length}</b><u onclick="${todo[0][3]}">첫 번째 보기 ›</u></div>`:''}
    <div class="card">${todo.length? todo.map(([t,d,n,act])=>
      `<div class="rw" onclick="${act}" style="cursor:pointer">
        <div class="nm"><b>${t}</b><span>${d}</span></div><span class="b">${n}</span></div>`).join('')
      : `<div class="empty">지금 손볼 것이 없어요</div>`}</div>`);
}

/* ── 회원 ── 이름만 굵게, 나머지는 회색 한 줄. 성별은 세 칸 토글. */
let USEEN='';                    // 접속 기간 필터
async function drawUsers(){
  const rows=await api('/admin/users'+(UQ?('?q='+encodeURIComponent(UQ)):''));
  const noG=rows.filter(u=>!gLabel(u.gender)).length;
  const D=864e5, now=Date.now();
  /* 접속 기간으로 거르기 — 관리자가 이 화면을 보는 진짜 이유는
     <이 사람이 언제 왔나>가 아니라 <안 오는 사람이 누구인가>다. */
  const F={
    '':      ()=>true,
    today:   u=>u.last_seen && now-u.last_seen < D,
    week:    u=>u.last_seen && now-u.last_seen < 7*D,
    old:     u=>u.last_seen && now-u.last_seen >= 30*D,
    never:   u=>!u.last_seen,
    ios:     u=>u.last_plat==='ios',
    web:     u=>u.last_plat && u.last_plat!=='ios',
    nog:     u=>!gLabel(u.gender),
  };
  const list=rows.filter(F[USEEN]||F['']);
  const cnt=k=>rows.filter(F[k]).length;
  const chip=(k,l,warn)=>`<span class="fchip ${USEEN===k?'on':''} ${warn&&cnt(k)?'w':''}"
    onclick="USEEN='${USEEN===k?'':k}';render()">${l} <em>${cnt(k)}</em></span>`;

  $('app').innerHTML=shell(`
    <div class="srch">
      <input id="uq" value="${esc(UQ)}" placeholder="이름으로 찾기"
        onkeydown="if(event.key==='Enter'){UQ=this.value.trim();render()}">
      <button onclick="UQ=($('uq')||{}).value.trim();render()">찾기</button>
      <button onclick="dlUsers()" style="background:#fff;color:var(--gray);
        border:1px solid var(--line)">내려받기</button></div>

    <div class="fbar">${chip('','전체')}${chip('today','오늘')}${chip('week','7일')}
      ${chip('old','30일+',1)}${chip('never','기록 없음')}${chip('ios','아이폰')}${chip('web','웹')}${chip('nog','성별 없음',1)}</div>

    ${USEEN==='nog'&&noG?`<div class="warn"><b>성별이 빈 회원 ${noG}명</b>
      <u onclick="fillGender()">클럽 값으로 채우기</u></div>`:''}

    <div class="card">${list.length? list.map(u=>{
      const g=gLabel(u.gender);
      const a=ago(u.last_seen);
      const PROV={kakao:'카카오', google:'구글', apple:'애플', dev:'개발'};
      const pv=PROV[u.provider]||u.provider||'';
      /* 얼굴 색은 이름에서 고정으로 뽑는다 — 새로고침해도 같은 색이어야
         목록을 훑을 때 사람이 자리로 기억된다 */
      const HUE=['#e8a87c','#8fbfa8','#c4a8d4','#7fa8c9','#d9a5a5','#b0b88a'];
      const col=HUE[(String(u.name||'?').charCodeAt(0)||0)%HUE.length];
      const gone=!u.last_seen || (now-u.last_seen)>=30*D;
      return `<div class="urw${gone?' gone':''}" onclick="openU(${u.id})">
        <span class="av" style="background:${g?col:'#f2f1ec'};color:${g?'#fff':'#8a8378'}">${
          esc(String(u.name||'?')[0])}</span>
        <div class="ub">
          <div class="ut"><b>${esc(u.name||'이름 없음')}</b>${
            g ? `<i class="${g==='여성'?'f':'m'}">${g[0]}</i>`
              : `<i class="none">성별 없음</i>`}<s>·</s><i class="p">${esc(pv)}</i>${
            u.last_plat ? `<s>·</s><i class="dv ${u.last_plat==='ios'?'ios':''}">${
              u.last_plat==='ios'?'아이폰':u.last_plat==='web'?'웹':esc(u.last_plat)}</i>`:''}</div>
          <span class="us">#${u.id} · 티어 ${fmt(u.rating_doubles||1000)}${
            (u.tier_games||0)<TIER_MIN ? ' · 배치 전' : ` · ${u.tier_games}경기`}</span></div>
        <div class="usn"><b class="${a.cls}">${a.txt}</b><i>${
          u.last_seen ? stamp(u.last_seen) : '8/28부터 기록'}</i></div>
        <span class="go">›</span></div>`;}).join('')
      : `<div class="empty">${UQ?'찾는 회원이 없어요':'해당하는 회원이 없어요'}</div>`}
    </div>
    <div class="note">회원을 누르면 성별을 고치거나 알림을 보낼 수 있어요</div>`);
}
/* 회원 하나 — 목록에서 버튼을 다 빼고 여기로 모은다.
   100명 줄마다 버튼 네 개가 달려 있으면 정작 봐야 할 게 안 보인다. */

  const g=gLabel(u.gender), a=ago(u.last_seen);
  const PROV={kakao:'카카오', google:'구글', apple:'애플', dev:'개발'};
  $('sheet').innerHTML=`
    <div class="sh-top"><h3>${esc(u.name||'이름 없음')}</h3>
      <div class="cl" onclick="closeU()">×</div></div>
    <div class="ur"><span>번호</span><b>#${u.id}</b></div>

    <div class="ur"><span>기기</span><b>${
      u.last_plat==='ios'?'아이폰 앱':u.last_plat==='web'?'웹':u.last_plat?esc(u.last_plat):'모름'}</b></div>
    <div class="ur"><span>티어 레이팅</span><b>${fmt(u.rating_doubles||1000)}${
      (u.tier_games||0)<TIER_MIN ? ` · 배치까지 ${TIER_MIN-(u.tier_games||0)}경기` : ` · ${u.tier_games}경기`}</b></div>
    <div class="ur"><span>성별</span><b>${g||'없음'}${
      u.gender_src==='club'?' · 클럽 지정':u.gender_src==='self'?' · 본인 설정':''}</b></div>
    <div class="ul">성별 바꾸기</div>

      <b class="${g==='여성'?'on':''}" onclick="setGender(${u.id},'${esc(u.name)}','여성')">여성</b>
      <b class="${!g?'on':''}" onclick="setGender(${u.id},'${esc(u.name)}','')">없음</b></div>
    <div class="uact">
      <button onclick="pushTest(${u.id},'${esc(u.name)}')">시험 알림 보내기</button>
      ${u.suspended?`<button class="danger" onclick="purgeUser(${u.id})">기록 영구 삭제</button>`:''}
    </div>`;
  $('ov').classList.add('on');
}
function closeU(){ $('ov').classList.remove('on'); UROWS=null; }

/* ── 분석 ──
   외부 도구를 붙이면 회원 정보가 밖으로 나가므로 우리 서버에 쌓은 것만 본다.
   숫자를 늘어놓기보다 <어디서 멈추는가>를 먼저 보여준다. */
let TDAYS=7;
async function drawTrack(){
  const [t, fn] = await Promise.all([
    api('/admin/track?days='+TDAYS),
    api('/admin/funnel?days=30&steps=' + encodeURIComponent(
      'view:club,event:create,draw:open,draw:publish')).catch(()=>({steps:[]})),
  ]);
  const NM={ 'view:home':'홈','view:om':'오픈매치','view:club':'클럽','view:sched':'일정',
    'view:me':'내 정보','draw:open':'대진 짜기 열기','draw:publish':'대진 발행',
    'rsvp':'참석 체크','xc:create':'교류전 열기','xc:join':'교류전 참가',
    'xc:draw':'교류전 대진','club:create':'클럽 만들기','event:create':'모임 만들기' };
  const nm=k=>NM[k]||k;
  const maxS=Math.max(1, ...(t.screens||[]).map(x=>x.n));
  const maxA=Math.max(1, ...(t.actions||[]).map(x=>x.n));
  const bar=(l,n,u,mx,col)=>`<div class="tbar">
    <span class="l">${esc(l)}</span>
    <span class="t"><i style="width:${Math.round(n/mx*100)}%;background:${col||'#ec6a2e'}"></i></span>
    <span class="v">${fmt(n)}<em>${fmt(u)}명</em></span></div>`;

  /* 깔때기 — 앞 단계를 거친 사람 중 몇이 다음으로 갔나 */
  const F=(fn.steps||[]);
  const f0=F.length?F[0].n:0;
  const funnel = !F.length ? '' : `<div class="card"><div class="ct">클럽 → 대진 (30일)</div>
    ${F.map((st,i)=>{
      const pct=f0?Math.round(st.n/f0*100):0;
      const drop=i? (F[i-1].n? Math.round((1-st.n/F[i-1].n)*100):0) : 0;
      return `<div class="fstep">
        <div class="fl"><b>${nm(st.name)}</b>${i?`<em class="${drop>50?'bad':''}">−${drop}%</em>`:''}</div>
        <div class="ft"><i style="width:${pct}%"></i></div>
        <div class="fn">${fmt(st.n)}명 <span>${pct}%</span></div></div>`;}).join('')}
    <div class="note" style="margin-top:8px">
      앞 단계를 거친 사람 중 몇이 다음으로 갔는지예요.
      한 칸에서 절반 넘게 빠지면 거기가 막힌 곳입니다.</div></div>`;

  $('app').innerHTML=shell(`
    <div class="fbar">${[[1,'오늘'],[7,'7일'],[30,'30일'],[90,'90일']].map(([d,l])=>
      `<span class="fchip ${TDAYS===d?'on':''}" onclick="TDAYS=${d};render()">${l}</span>`).join('')}</div>
    <div class="card"><div class="ct">${TDAYS}일 동안</div>
      <div class="kpi3">
        <div><b>${fmt(t.users)}</b><i>쓴 사람</i></div>
        <div><b>${fmt(t.total)}</b><i>기록 수</i></div>
        <div><b>${t.users?Math.round(t.total/t.users):0}</b><i>1인 평균</i></div>
      </div></div>
    ${funnel}
    <div class="card"><div class="ct">어느 화면을 보나</div>
      ${(t.screens||[]).length ? t.screens.map(x=>bar(nm(x.name),x.n,x.u,maxS)).join('')
        : '<div class="empty">아직 기록이 없어요</div>'}</div>
    <div class="card"><div class="ct">무엇을 하나</div>
      ${(t.actions||[]).length ? t.actions.map(x=>bar(nm(x.name),x.n,x.u,maxA,'#2b62c9')).join('')
        : '<div class="empty">아직 기록이 없어요</div>'}</div>
    ${(t.platforms||[]).length?`<div class="card"><div class="ct">기기</div>
      ${t.platforms.map(p=>bar(p.p==='ios'?'아이폰':p.p==='web'?'웹':p.p, p.n, p.n,
        Math.max(1,...t.platforms.map(x=>x.n)), '#1f7d4d')).join('')}</div>`:''}
    <div class="note">기록은 우리 서버에만 쌓아요 · 화면 이름과 행동만 남고 내용은 담지 않습니다</div>`);
}

/* 상대 클럽 붙이기 — 다른 계정으로 로그인해 신청하기가 번거롭다 */
/* 지우기 전에 누가 지워지는지 먼저 보여준다 — 진짜 회원이 섞였는지 눈으로 확인할 수 있어야 한다 */
async function showTest(){

  $('sheet').innerHTML=`
    <div class="sh-top"><h3>테스트 계정 ${r.n}명</h3>
      <div class="cl" onclick="closeU()">×</div></div>
    <div class="note" style="margin-bottom:10px">

    ${r.rows.map(u=>`<div style="display:flex;align-items:center;gap:9px;padding:9px 2px;

async function purgeTest(){
  if(!confirm('테스트로 만든 가짜 회원을 모두 지울까요?\n그 회원이 낀 교류전 대진도 함께 지워집니다.')) return;
  try{ const r=await api('/admin/test-users/purge',{method:'POST'});
    toast(r.n?`${r.n}명을 지웠어요${r.games?` · 대진 ${r.games}경기도 정리`:''}`:'지울 계정이 없어요');

  catch(e){ toast('지우지 못했어요'); }

async function xcOpp(id){

}
async function xcScores(id){

}
async function xcClear(id){
  if(!confirm('참석과 대진을 모두 지울까요?')) return;
  try{ await api(`/admin/exchange/${id}/clear`,{method:'POST'}); toast('비웠어요'); render(); }
  catch(e){ toast('비우지 못했어요'); }
}
function errMsg(e, fb){
  let m=String((e&&e.message)||'');
  try{ const j=JSON.parse(m); if(j&&j.message) return j.message; }catch(_){}
  return /^\s*\{/.test(m) ? fb : (m||fb);
}

/* 오픈매치 열기 — 코트가 먼저 열리고 사람들은 신청만 한다.
   종목과 티어 범위를 여기서 정하지 않으면 목록에서 거를 수가 없다. */
let OM_NEW_OPEN=false, OM_SLOTS=null, OM_SLOT=null;
/* 오픈매치는 구장 사장님이 열어둔 시간대에서만 만든다.
   코트비·시간·코트 수는 슬롯에 이미 들어 있으므로 종목과 티어만 더 받는다. */
function omNewForm(){
  if(!OM_NEW_OPEN) return `<div class="card flat" style="cursor:pointer" onclick="openOmNew()">
    <div class="rw"><div class="nm"><b>＋ 오픈매치 열기</b>
      <span>구장이 열어둔 시간에서 골라요</span></div><span class="b">열기</span></div></div>`;
  if(OM_SLOTS===null) return `<div class="card flat"><div class="ct">오픈매치 열기</div>
    <div class="empty">열린 시간을 불러오는 중…</div></div>`;
  if(!OM_SLOTS.length) return `<div class="card flat"><div class="ct">오픈매치 열기</div>
    <div class="empty">구장이 열어둔 시간이 없어요<br>
      <span style="font-size:11px">사장님이 구장 화면에서 시간대를 열면 여기 나와요</span></div>
    <button class="b" style="margin-top:var(--s3)" onclick="OM_NEW_OPEN=false;render()">닫기</button></div>`;

  const sel=(id,l,opts)=>`<div class="fld"><label>${l}</label><select id="${id}">${
    opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`;
  const T=[['','제한 없음'],['love','러브'],['fut','퓨처스'],['chal','챌린저'],['tour','투어'],['gs','그랜드슬램']];
  const s2=OM_SLOTS.find(x=>x.id===OM_SLOT);
  let h=`<div class="card flat"><div class="ct">오픈매치 열기</div>
    <div class="note" style="margin:0 0 var(--s2)">구장이 열어둔 시간이에요. 하나를 고르면 코트비가 따라와요.</div>
    <div class="slots">${OM_SLOTS.map(x=>`
      <div class="slot ${OM_SLOT===x.id?'on':''}" onclick="OM_SLOT=${x.id};render()">
        <b>${esc(x.venue_name||'')}</b>
        <span>${esc(x.date)} ${esc(x.start)}–${esc(x.end)} · ${x.courts}코트</span>
        <i>${(x.price||0).toLocaleString()}원</i></div>`).join('')}</div>`;
  if(s2){
    const managed=s2.courts>1;
    h+=`<div class="frow" style="margin-top:var(--s3)">
        ${sel('nmDisc','종목',[['mixed','혼합복식'],['men','남자복식'],['women','여자복식']])}
        <div class="fld"><label>정원</label><input id="nmCap" value="${managed?s2.courts*5:4}"></div></div>
      <div class="frow">${sel('nmFee','수수료',[['0.2','한산한 시간 20%'],['0.1','붐비는 시간 10%']])}
        <div class="fld"><label>진행</label><input value="${managed?'매니저 운영':'자율 (매니저 없음)'}" disabled></div></div>
      <div class="frow">${sel('nmTmin','티어 하한',T)}${sel('nmTmax','티어 상한',T)}</div>`;
  }
  h+=`<div style="display:flex;gap:var(--s2);margin-top:var(--s3)">
      <button class="b" onclick="OM_NEW_OPEN=false;OM_SLOT=null;render()">닫기</button>
      <button class="b on" style="flex:1" ${s2?'':'disabled'} onclick="createOm()">
        ${s2?'이 시간으로 열기':'시간을 골라주세요'}</button></div>
    <div class="note" style="margin-top:var(--s2)">참가비는 코트비와 수수료에서 자동 계산돼요.
      마감은 시작 24시간 전이에요.</div></div>`;
  return h;
}
async function openOmNew(){ OM_NEW_OPEN=true; OM_SLOTS=null; OM_SLOT=null; render();
  try{ OM_SLOTS=await api('/admin/venue-slots'); }catch(e){ OM_SLOTS=[]; }
  render();

async function createOm(){
  if(!OM_SLOT) return toast('시간을 골라주세요');
  const v=id=>(($(id)||{}).value||'').trim();
  try{
    await api(`/venue-slots/${OM_SLOT}/open-match`,{method:'POST',body:JSON.stringify({
      disc:v('nmDisc'), cap:+v('nmCap')||undefined, fee_rate:+v('nmFee')||0.2,

  }catch(e){ toast('열지 못했어요 · '+String(e.message).slice(0,40)); }
}

/* ── 구장 ── 넷을 한 화면 안쪽 탭으로 */
async function drawVenues(){
  const sub=SUB||'list';
  /* 바깥 탭이 이미 <구장>이라 안쪽 첫 칸은 <목록>으로 둔다 — 같은 말이 두 번 보이면 헷갈린다 */
  const tabs=[['list','목록'],['book','예약'],['slots','열린 시간'],['pay','정산']];
  const ep={list:'/admin/venues', book:'/admin/venue-bookings',
            slots:'/admin/venue-slots', pay:'/admin/venue-payouts/by-venue'}[sub];
  const rows=await api(ep).catch(()=>[]);
  const line=r=>{
    if(sub==='list') return [`${esc(r.name)}`,
      `#${r.id} · ${esc([r.sido,r.sigungu].filter(Boolean).join(' ')||r.addr||'주소 없음')} · 코트 ${(r.courts||[]).length}면`, ''];
    if(sub==='book') return [`${esc(r.venue_name||r.venue||'구장')}`,
      `${esc(r.date||'')} ${esc(r.start||'')} · ${esc(r.user_name||'')} · ${fmt(r.amount)}원`, r.status||''];
    if(sub==='slots') return [`${esc(r.venue_name||r.venue||'구장')}`,
      `${esc(r.date||'')} ${esc(r.start||'')}~${esc(r.end||'')} · ${r.court||''}번 코트`, r.open?'열림':'닫힘'];
    return [`${esc(r.venue_name||r.name||'구장')}`, `건수 ${r.count||0} · 정산 대기`, `${fmt(r.amount)}원`];
  };
  /* 구장은 목록만 보여주고 고칠 길이 없었다 — 이름·주소·전화를 여기서 바로 고친다.
     서버에 PATCH /admin/venues/:id 가 이미 있는데 화면이 안 쓰고 있었다. */
  const editable = (sub==='list');
  $('app').innerHTML=shell(subTabs(tabs)+
    (editable?`<div class="card flat"><div class="ct">구장 추가</div>
      <div style="display:flex;gap:var(--s2);margin-top:var(--s2)">
        <input id="vn" placeholder="구장 이름" style="flex:1;border:1px solid var(--line);border-radius:10px;
          padding:8px 10px;font-size:var(--t2);font-family:inherit;font-weight:500">
        <button class="b on" onclick="addVenue()">추가</button></div></div>`:'')+
    `<div class="card">${rows.length? rows.map(r=>{
      const [a,b,c]=line(r);
      return `<div class="rw"><div class="nm"><b>${a}</b><span>${b}</span></div>
        ${editable?`<button class="b" onclick="editVenue(${r.id})">수정</button>`
                  :(c?`<span class="b">${esc(c)}</span>`:'')}</div>`;}).join('')
      : `<div class="empty">아직 없어요</div>`}</div>`);
  CACHE.venues=rows;
}
async function addVenue(){
  const name=(($('vn')||{}).value||'').trim();
  if(!name){ toast('구장 이름을 넣어주세요'); return; }
  try{ await api('/admin/venues',{method:'POST',body:JSON.stringify({name})});
    toast('추가했어요'); render(); }
  catch(e){ toast('추가하지 못했어요'); }
}
/* 한 줄씩 물어보는 대신 값을 미리 채워 보여준다 — 비워 두면 그대로 둔다 */
async function editVenue(id){
  const v=(CACHE.venues||[]).find(x=>x.id===id); if(!v) return;
  const name=prompt('구장 이름', v.name||''); if(name===null) return;
  const addr=prompt('주소', v.addr||''); if(addr===null) return;
  const phone=prompt('전화', v.phone||''); if(phone===null) return;
  try{ await api('/admin/venues/'+id,{method:'PATCH',
      body:JSON.stringify({name:name.trim(), addr:addr.trim(), phone:phone.trim()})});
    toast('고쳤어요'); render(); }
  catch(e){ toast('고치지 못했어요'); }
}

/* ── 신고 ── */
async function drawReports(){
  const rows=await api('/admin/reports');
  $('app').innerHTML=shell(`<div class="card">${rows.length? rows.map(r=>`
    <div class="rw"><div class="nm"><b>${esc(r.reason||'신고')}<span class="tag">${esc(r.target_type||'')}</span></b>
      <span>${esc((r.target&&r.target.title)||'')} · ${ymd(r.created_at)}</span></div>
      <div class="seg3">
        <button class="b dz" onclick="resolveRep(${r.id},'hide')">숨기기</button>
        <button class="b" onclick="resolveRep(${r.id},'dismiss')">반려</button></div></div>`).join('')
    : `<div class="empty">처리할 신고가 없어요</div>`}</div>`);
}

/* ── 정산 ── */
async function drawPayouts(){
  const rows=await api('/admin/payouts').catch(()=>[]);
  $('app').innerHTML=shell(`<div class="card">${rows.length? rows.map(p=>`
    <div class="rw"><div class="nm"><b>${esc(p.name||p.manager_name||'매니저')}</b>
      <span>${ymd(p.created_at)} · ${esc(p.status||'')}</span></div>
      <span class="b">${fmt(p.amount)}원</span></div>`).join('')
    : `<div class="empty">정산할 건이 없어요</div>`}</div>`);
}

/* ── 계정 ── 스태프·매니저·구장 계정을 한 화면에서 */
async function drawStaff(){
  const sub=SUB||'staff';
  const tabs=[['staff','스태프'],['mgrs','매니저'],['venue','구장 계정']];
  const ep={staff:'/admin/staff-accounts', mgrs:'/admin/managers', venue:'/admin/venue-accounts'}[sub];
  const rows=await api(ep).catch(()=>[]);
  $('app').innerHTML=shell(subTabs(tabs)+`<div class="card">${rows.length? rows.map(a=>`
    <div class="rw"><div class="nm"><b>${esc(a.name||a.login||a.email||'계정')}
      ${a.grade?`<span class="tag">${esc(a.grade)}</span>`:''}</b>
      <span>${esc(a.role||a.venue_name||'')} ${a.created_at?('· '+ymd(a.created_at)):''}</span></div></div>`).join('')
    : `<div class="empty">계정이 없어요</div>`}</div>`);
}

/* ── 배너 ──
   배너는 <이미지>가 본체다(image·link·slot·sort). 예전 화면은 글자만 늘어놓아
   무엇이 걸려 있는지 볼 수 없었고 고칠 수도 없었다. 그림을 보여주고 바로 손보게 한다. */
async function drawBanners(){
  const rows=await api('/admin/banners').catch(()=>[]);
  const SLOT={home:'홈',club:'클럽',match:'매치'};
  $('app').innerHTML=shell(`
    <div class="card flat"><div class="ct">배너 올리기</div>
      <div style="display:flex;gap:var(--s2);margin-top:var(--s2)">
        <select id="bslot" class="b" style="padding:8px 10px">
          ${Object.entries(SLOT).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
        <input id="blink" placeholder="눌렀을 때 갈 주소 (선택)"
          style="flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
          font-size:var(--t2);font-family:inherit;font-weight:500"></div>
      <div style="display:flex;gap:var(--s2);margin-top:var(--s2)">
        <input id="bfile" type="file" accept="image/*" style="flex:1;font-size:var(--t1)">
        <button class="b on" onclick="upBanner()">올리기</button></div>
      <div class="note">3MB 까지 · 가로로 긴 이미지가 잘 맞아요</div></div>
    <div class="card">${rows.length? rows.map((b,i)=>`
      <div class="rw">
        <img src="${esc(b.image||'')}" alt="" style="width:76px;height:44px;border-radius:9px;
          object-fit:cover;background:#f4f1ea;flex:none">
        <div class="nm"><b>${esc(SLOT[b.slot]||b.slot||'홈')}<span class="tag">${i+1}번째</span></b>
          <span>${esc(b.link||'링크 없음')}</span></div>
        <div class="seg3">
          <button class="b" onclick="moveBanner(${i},-1)" ${i===0?'disabled style="opacity:.35"':''}>↑</button>
          <button class="b" onclick="moveBanner(${i},1)" ${i===rows.length-1?'disabled style="opacity:.35"':''}>↓</button>
          <button class="b dz" onclick="delBanner(${b.id})">삭제</button></div></div>`).join('')
      : `<div class="empty">걸린 배너가 없어요</div>`}</div>`);
  CACHE.banners=rows;
}
async function upBanner(){
  const f=($('bfile')||{}).files && $('bfile').files[0];
  if(!f){ toast('이미지를 골라주세요'); return; }
  if(f.size > 3*1024*1024){ toast('3MB 까지 올릴 수 있어요'); return; }
  const image=await new Promise((ok,no)=>{ const r=new FileReader();
    r.onload=()=>ok(r.result); r.onerror=()=>no(new Error('read')); r.readAsDataURL(f); });
  try{ await api('/admin/banners',{method:'POST',body:JSON.stringify({
      image, link:($('blink')||{}).value||'', slot:($('bslot')||{}).value||'home' })});
    toast('배너를 올렸어요'); render(); }
  catch(e){ toast('올리지 못했어요 · 3MB 안쪽인지 확인해 주세요'); }
}
async function moveBanner(i,d){
  const rows=(CACHE.banners||[]).slice();
  const j=i+d; if(j<0||j>=rows.length) return;
  [rows[i],rows[j]]=[rows[j],rows[i]];
  try{ await api('/admin/banners/order',{method:'PATCH',body:JSON.stringify({ids:rows.map(b=>b.id)})});
    toast('순서를 바꿨어요'); render(); }
  catch(e){ toast('바꾸지 못했어요'); }
}
async function delBanner(id){
  if(!confirm('이 배너를 내릴까요?')) return;
  try{ await api('/admin/banners/'+id,{method:'DELETE'}); toast('내렸어요'); render(); }
  catch(e){ toast('내리지 못했어요'); }
}

/* 성별을 고치면 그 사람이 낀 대진의 남복·혼복 표기가 바뀐다.
   이미 만들어진 대진표는 그대로이고, 새로 짜는 것부터 반영된다. */
/* 클럽에서 이미 정해 둔 성별을 본인 값으로 한 번에 옮긴다 —
   운영진이 채워둔 것을 관리자가 다시 47번 누를 이유가 없다. */
async function fillGender(){
  if(!confirm('클럽에서 정해 둔 성별을 회원 정보로 옮길까요?')) return;
  try{ const r=await api('/admin/users/fill-gender',{method:'POST'});
    toast(`${r.filled||0}명을 채웠어요`); render(); }
  catch(e){ toast('채우지 못했어요 · 서버를 확인해 주세요'); }
}
/* 그 회원 폰으로 시험 알림을 보낸다 — 실제로 도착하는지가 유일한 확인 방법이다 */
/* 회원 명단을 CSV 로 내려받는다 — 나중에 DB 로 옮기거나 엑셀에서 훑어보게.
   fetch 로 받아야 관리자 키를 헤더에 실을 수 있다(주소창으로 열면 403). */
async function dlUsers(){
  try{
    toast('명단을 만들고 있어요');
    const r=await fetch('/admin/users.csv',{headers:{'x-admin-key':key()}});
    if(!r.ok) throw new Error(r.status);
    const blob=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`matsu-users-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  }catch(e){ toast('내려받지 못했어요'); }
}
async function pushTest(id, name){
  try{
    const r=await api('/admin/push-test?user='+id,{method:'POST'});
    if(!r.ok) return toast(r.reason||'보내지 못했어요');
    const sent=(r.sent||[]);
    if(!sent.length) return toast(`${name} 님은 아이폰이 등록돼 있지 않아요`);
    const ok=sent.filter(x=>x.ok).length;
    if(ok) return toast(`${name} 님께 보냈어요 · 폰을 확인해 주세요`);
    const why=(sent.find(x=>x.reason)||{}).reason||'';
    toast(why==='InvalidProviderToken' ? '키 정보가 맞지 않아요 (Key ID·Team ID)'
        : why==='BadTopic' ? 'Bundle ID 가 맞지 않아요'
        : why==='Unregistered' ? '앱이 지워진 기기예요'
        : `보내지 못했어요${why?' · '+why:''}`);
  }catch(e){ toast('보내지 못했어요 · 서버를 확인해 주세요'); }
}
async function setGender(id, name, g){
  try{ await api('/admin/users/'+id+'/gender',{method:'POST',body:JSON.stringify({gender:g})});
    toast(g?`${name} · ${g}`:`${name} · 성별 지움`);
    UROWS=null; closeU(); render(); }
  catch(e){ toast('바꾸지 못했어요'); }
}
/* 탈퇴한 계정의 남은 기록을 지운다.
   탈퇴는 이름만 <탈퇴한 회원>으로 바꾸고 행은 남겨두기 때문에 목록에 계속 보인다.
   되돌릴 수 없어서 회원번호를 직접 받아 확인한다 — 목록에서 한 칸 밀려 눌리면 끝이다. */
async function purgeUser(id){
  const t=prompt(`#${id} 탈퇴 회원의 남은 기록을 영구 삭제할까요?\n되돌릴 수 없어요.\n\n확인하려면 회원번호 ${id} 를 입력해 주세요.`);
  if(String(t||'').trim()!==String(id)) return toast('삭제하지 않았어요');
  try{
    const r=await api('/admin/users/'+id,{method:'DELETE'});
    toast(`${r.deleted||'회원'} · 영구 삭제했어요`); render();
  }catch(e){ toast('삭제하지 못했어요 · 활성 계정일 수 있어요'); }
}
async function delUser(id,name){
  if(!confirm(`${name} 회원을 삭제할까요? 활동 기록까지 지워지고 되돌릴 수 없어요.`)) return;
  try{ await api('/admin/users/'+id+'?force=1',{method:'DELETE'}); toast('삭제했어요'); render(); }
  catch(e){ toast('삭제하지 못했어요'); }
}
async function delClub(id,name){
  if(!confirm(`${name} 클럽을 삭제할까요? 되돌릴 수 없어요.`)) return;
  try{ await api('/admin/clubs/'+id,{method:'DELETE'}); toast('삭제했어요'); render(); }
  catch(e){ toast('삭제하지 못했어요'); }
}
async function resolveRep(id,action){
  try{ await api('/admin/reports/'+id+'/resolve',{method:'POST',body:JSON.stringify({action})});
    toast('처리했어요'); render(); }
  catch(e){ toast('처리하지 못했어요'); }
}
async function addBots(){
  if(!SEL){ toast('매치를 먼저 골라주세요'); return; }
  const bots=[...document.querySelectorAll('#botRows > div')].map(d=>{
    const sel=d.querySelector('.br'), op=sel.options[sel.selectedIndex];
    return { name:d.querySelector('.bn').value.trim(), gender:d.querySelector('.bg').value,
             years:+sel.value, rating:+(op&&op.dataset.r||1000) };
  }).filter(b=>b.name).slice(0,20);
  if(!bots.length){ toast('이름을 입력해 주세요'); return; }
  try{ const r=await api(`/admin/open-matches/${SEL}/bots`,{method:'POST',body:JSON.stringify({bots})});
    toast(`${r.added||0}명을 추가했어요`); render(); }
  catch(e){ toast('추가하지 못했어요'); }
}
render();
</script></body></html>
