<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>맞수 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 맞수 앱과 같은 눈금을 쓴다 — 글자 8.7·11·14·18·23·29, 여백 4·6·10·17·27.
   예전 admin 은 글자 크기가 14가지에 굵기가 대부분 800~900 이라
   무엇이 중요한지 안 보였다. 본문은 400~500, 강조만 600~700 으로 둔다. */
:root{
  --ink:#1c1b18; --ink2:#3a352d; --gray:#7d7870; --lgray:#a8a29a;
  --coral:#ec6a2e; --coral-d:#cf5418; --gold:#e09a2b; --gold-bg:#fdf6ea;
  --line:#eae6dd; --paper:#faf8f5; --red:#c14545;
  --t0:8.7px; --t1:11px; --t2:14px; --t3:18px; --t4:23px; --t5:29px;
  --s1:4px; --s2:6px; --s3:10px; --s4:17px; --s5:27px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
  letter-spacing:-.018em;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding:var(--s4) var(--s3) 60px;word-break:keep-all}
.wrap{max-width:680px;margin:0 auto}
.hd{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s4)}
.hd h1{font-size:var(--t4);font-weight:700;letter-spacing:-.04em}
.hd .who{font-size:var(--t1);color:var(--lgray);font-weight:500;margin-left:auto}
.segs{display:flex;gap:2px;background:#f1eee7;border-radius:12px;padding:3px;margin-bottom:var(--s3)}
.seg{flex:1;text-align:center;padding:7px 2px;border-radius:9px;font-size:var(--t1);
  font-weight:500;color:var(--gray);cursor:pointer;white-space:nowrap;transition:.12s}
.seg.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(27,24,19,.08)}
.more{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
.more span{font-size:var(--t1);color:var(--gray);font-weight:500;cursor:pointer;
  padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--line)}
.more span.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.card{background:#fff;border-radius:16px;padding:var(--s3) var(--s4) var(--s4);
  box-shadow:0 1px 2px rgba(40,30,18,.04);margin-bottom:var(--s3)}
.card.flat{padding:var(--s4)}
.ct{font-size:var(--t2);font-weight:600;letter-spacing:-.02em;margin-bottom:var(--s2)}
.rw{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid #f4f1ea}
.rw:first-child{border-top:0}
.nm{flex:1;min-width:0}
.nm b{display:flex;align-items:baseline;gap:var(--s2);font-size:var(--t2);font-weight:600;
  letter-spacing:-.02em;min-width:0}
.nm b > .tag{margin-left:0;flex:none}
.nm span{display:block;font-size:var(--t1);color:var(--lgray);font-weight:500;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:var(--t0);font-weight:600;border-radius:20px;padding:2px 7px;
  background:#f4f1ea;color:var(--gray);margin-left:var(--s2);vertical-align:1px;white-space:nowrap}
.tag.f{background:#fdeef4;color:#c94378} .tag.m{background:#eaf2ff;color:#2b62c9}
.tag.o{background:#fceee4;color:var(--coral-d)} .tag.g{background:#edf2ec;color:#4c7a5c}
.seg3{display:flex;gap:3px;flex:none}
.b{font-size:var(--t1);font-weight:500;border-radius:9px;padding:5px 10px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--gray);font-family:inherit}
.b.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.b.dz{border-color:#f0dcdc;color:var(--red)}
.b:active{transform:scale(.97)}
.warn{display:flex;align-items:center;gap:var(--s2);background:var(--gold-bg);border-radius:12px;
  padding:var(--s3) var(--s4);margin-bottom:var(--s3);font-size:var(--t1);color:#8a6a3a;font-weight:500}
.warn b{color:#7a5a1a;font-weight:700}
.warn u{margin-left:auto;text-decoration:none;font-weight:600;color:var(--coral-d);cursor:pointer;white-space:nowrap}
.srch{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
.srch input{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 12px;
  font-size:var(--t2);font-family:inherit;font-weight:500;background:#fff;color:var(--ink)}
.srch input:focus{outline:0;border-color:var(--coral)}
.srch button{border:0;border-radius:12px;padding:0 var(--s4);background:var(--ink);color:#fff;
  font-size:var(--t1);font-weight:600;font-family:inherit;cursor:pointer}
.kpi{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
.kpi div{flex:1;background:#fff;border-radius:14px;padding:var(--s3) var(--s2);text-align:center;
  box-shadow:0 1px 2px rgba(40,30,18,.04)}
.kpi b{display:block;font-size:var(--t3);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:var(--t1);color:var(--lgray);font-weight:500;margin-top:1px}
.empty{text-align:center;color:var(--lgray);font-size:var(--t1);font-weight:500;padding:var(--s5) 0}
.note{font-size:var(--t1);color:var(--lgray);font-weight:500;line-height:1.65;margin-top:var(--s2)}
.gate{max-width:340px;margin:60px auto}
.gate h2{font-size:var(--t3);font-weight:700;margin-bottom:var(--s2)}
.gate p{font-size:var(--t1);color:var(--gray);font-weight:500;margin-bottom:var(--s4)}
.gate input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  font-size:var(--t2);font-family:inherit;font-weight:500;margin-bottom:var(--s2)}
.gate button{width:100%;border:0;border-radius:12px;padding:12px;background:var(--ink);color:#fff;
  font-size:var(--t2);font-weight:600;font-family:inherit;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:#fff;
  font-size:var(--t1);font-weight:500;padding:10px 16px;border-radius:20px;opacity:0;
  transition:.2s;pointer-events:none;z-index:99;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.sk{background:#f4f1ea;border-radius:8px;height:12px;animation:p 1.2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}
</style></head><body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on');
  clearTimeout(window._tt); window._tt=setTimeout(()=>e.classList.remove('on'),2200); }
function key(){ return localStorage.getItem('matsu_admin_key')||''; }
async function api(path, opts){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','x-admin-key':key(),...((opts&&opts.headers)||{})}});
  if(!r.ok){ const t=await r.text().catch(()=>String(r.status)); throw new Error(t); }
  return r.json();
}
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const ymd=t=>{ if(!t) return ''; const d=new Date(t); if(isNaN(d)) return '';
  return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`; };

/* 탭 14개를 9개로 묶었다. 구장 관련 넷(구장·예약·열린 시간·정산)은 한 화면에서
   안쪽 탭으로 나누고, 매치와 인원 미달, 계정과 매니저 등급도 함께 본다.
   가로로 흐르던 14개는 뒤쪽에 무엇이 있는지 알 수 없었다. */
const MAIN=[['stats','현황'],['users','회원'],['clubs','클럽'],['matches','매치']];
const MORE=[['venues','구장'],['reports','신고'],['payouts','정산'],['staff','계정'],['banners','배너']];
let TAB='stats', SUB='', UQ='', UONLY='', SEL=null, CACHE={};

function gLabel(v){ const t=String(v||'').trim();
  if(!t) return '';
  return (t==='F'||t.startsWith('여')) ? '여성' : (t==='M'||t.startsWith('남')) ? '남성' : ''; }

function shell(inner){
  const seg=MAIN.map(([k,l])=>`<div class="seg ${TAB===k?'on':''}" onclick="go('${k}')">${l}</div>`).join('');
  const more=MORE.map(([k,l])=>`<span class="${TAB===k?'on':''}" onclick="go('${k}')">${l}</span>`).join('');
  return `<div class="hd"><h1>맞수 관리자</h1><span class="who">${esc(key().slice(0,4))}···</span></div>
    <div class="segs">${seg}</div><div class="more">${more}</div>${inner}`;
}
function go(k){ TAB=k; SUB=''; render(); }
function subTabs(list){
  return `<div class="more">${list.map(([k,l])=>
    `<span class="${(SUB||list[0][0])===k?'on':''}" onclick="SUB='${k}';render()">${l}</span>`).join('')}</div>`;
}
function skel(n){ return `<div class="card">${Array.from({length:n||3},()=>
  `<div class="rw"><div class="nm"><div class="sk" style="width:38%"></div>
   <div class="sk" style="width:62%;height:9px;margin-top:6px"></div></div></div>`).join('')}</div>`; }

async function render(){
  if(!key()){ $('app').innerHTML=`<div class="gate"><h2>관리자 열쇠</h2>
      <p>서버에 설정한 관리자 키를 넣어주세요.</p>
      <input id="k" type="password" placeholder="admin key" onkeydown="if(event.key==='Enter')saveKey()">
      <button onclick="saveKey()">들어가기</button></div>`; return; }
  $('app').innerHTML=shell(skel(4));
  try{ await draw(); }
  catch(e){ $('app').innerHTML=shell(`<div class="card"><div class="empty">
    불러오지 못했어요<br><span style="font-size:var(--t0)">${esc(String(e.message).slice(0,80))}</span></div></div>`); }
}
async function saveKey(){ const v=($('k')||{}).value||''; if(!v) return;
  localStorage.setItem('matsu_admin_key', v.trim());
  try{ await api('/admin/stats'); toast('접속했어요'); render(); }
  catch(e){ localStorage.removeItem('matsu_admin_key'); toast('열쇠가 맞지 않아요'); render(); } }

async function draw(){
  if(TAB==='stats')   return drawStats();
  if(TAB==='users')   return drawUsers();
  if(TAB==='clubs')   return drawClubs();
  if(TAB==='matches') return drawMatches();
  if(TAB==='venues')  return drawVenues();
  if(TAB==='reports') return drawReports();
  if(TAB==='payouts') return drawPayouts();
  if(TAB==='staff')   return drawStaff();
  if(TAB==='banners') return drawBanners();
}

/* ── 현황 ── 숫자만 보여주고 끝나던 화면에 <손볼 것>을 더한다.
   관리자가 여는 이유는 대개 할 일을 찾기 위해서다. */
async function drawStats(){
  /* 알림이 안 올 때 <키·토큰·발송> 중 어디가 문제인지 여기서 바로 본다.
     예전에는 콘솔을 열어 직접 불러와야 했다. */
  const [s, users, reps, push] = await Promise.all([
    api('/admin/stats'), api('/admin/users').catch(()=>[]), api('/admin/reports').catch(()=>[]),
    api('/admin/push-status').catch(()=>null)
  ]);
  const noG=users.filter(u=>!gLabel(u.gender)).length;
  const todo=[];
  if(noG) todo.push(['성별이 빈 회원','대진에서 남복·혼복이 잘못 잡혀요',`${noG}명`,`UONLY='nog';go('users')`]);
  if(reps.length) todo.push(['처리 안 한 신고','확인하고 숨기거나 반려해요',`${reps.length}건`,`go('reports')`]);
  const kpi=[['회원',s.users],['클럽',s.clubs],['오픈매치',s.open_matches!=null?s.open_matches:s.matches]];
  /* 알림 상태 — 준비됐는지, 폰이 몇 대 붙어 있는지 */
  const ios=push ? ((push.devices||[]).find(d=>d.platform==='ios')||{}).n||0 : 0;
  const web=push ? ((push.devices||[]).find(d=>d.platform==='web')||{}).n||0 : 0;
  const pushBlock = !push ? '' : `
    <div class="card"><div class="ct">알림</div>
      <div class="rw"><div class="nm">
        <b>${push.apns.ready?'보낼 준비가 됐어요':'아직 설정이 덜 됐어요'}
          <span class="tag ${push.apns.ready?'g':''}">${push.apns.ready?'APNs':'미설정'}</span></b>
        <span>${esc(push.apns.bundle_id||'Bundle ID 없음')}${
          push.apns.key_id?` · 키 ${esc(push.apns.key_id)}`:''}</span></div></div>
      <div class="rw"><div class="nm"><b>등록된 기기 ${ios+web}대</b>
        <span>${ios?`아이폰 ${ios}대`:'아이폰 없음 · 앱에서 알림을 허용해야 등록돼요'}${web?` · 웹 ${web}대`:''}</span></div>
        ${ios?'':`<span class="b">확인 필요</span>`}</div>
      ${(push.recent||[]).length?`<div class="rw"><div class="nm"><b>최근 등록</b>
        <span>${push.recent.slice(0,3).map(r=>esc(r.name)+' · '+r.platform).join(' / ')}</span></div>
        <button class="b" onclick="go('users')">시험 보내기</button></div>`:''}
    </div>`;
  $('app').innerHTML=shell(`
    <div class="kpi">${kpi.map(([l,v])=>`<div><b>${fmt(v)}</b><span>${l}</span></div>`).join('')}</div>
    ${pushBlock}
    ${todo.length?`<div class="warn"><b>손볼 것 ${todo.length}</b><u onclick="${todo[0][3]}">첫 번째 보기 ›</u></div>`:''}
    <div class="card">${todo.length? todo.map(([t,d,n,act])=>
      `<div class="rw" onclick="${act}" style="cursor:pointer">
        <div class="nm"><b>${t}</b><span>${d}</span></div><span class="b">${n}</span></div>`).join('')
      : `<div class="empty">지금 손볼 것이 없어요</div>`}</div>`);
}

/* ── 회원 ── 이름만 굵게, 나머지는 회색 한 줄. 성별은 세 칸 토글. */
async function drawUsers(){
  const rows=await api('/admin/users'+(UQ?('?q='+encodeURIComponent(UQ)):''));
  const noG=rows.filter(u=>!gLabel(u.gender)).length;
  const list=UONLY==='nog' ? rows.filter(u=>!gLabel(u.gender)) : rows;
  $('app').innerHTML=shell(`
    <div class="srch">
      <input id="uq" value="${esc(UQ)}" placeholder="이름으로 찾기"
        onkeydown="if(event.key==='Enter'){UQ=this.value.trim();render()}">
      <button onclick="UQ=($('uq')||{}).value.trim();render()">찾기</button></div>
    ${noG?`<div class="warn"><b>성별이 빈 회원 ${noG}명</b>
      <u onclick="fillGender()">클럽 값으로 채우기</u>
      <u onclick="UONLY='${UONLY==='nog'?'':'nog'}';render()" style="margin-left:var(--s3)">${UONLY==='nog'?'전체':'모아 보기 ›'}</u></div>`:''}
    <div class="card">${list.length? list.map(u=>{
      const g=gLabel(u.gender);
      const cls=g==='여성'?'f':g==='남성'?'m':'';
      /* 성별이 어디서 온 값인지 — 본인이 정한 값과 클럽에서 고쳐 둔 값은 뜻이 다르다 */
      const src=u.gender_src==='club' ? '클럽에서 정함' : '';
      return `<div class="rw">
        <div class="nm"><b>${esc(u.name||'이름 없음')}<span class="tag ${cls}">${g||u.provider||'—'}</span></b>
          <span>#${u.id} · ${esc(u.sport||'')} · 레이팅 ${fmt(u.rating)} · ${ymd(u.created_at)} 가입${
            src?` · ${src}`:''}</span></div>
        <div class="seg3">
          <button class="b ${g==='남성'?'on':''}" onclick="setGender(${u.id},'${esc(u.name)}','남성')">남</button>
          <button class="b ${g==='여성'?'on':''}" onclick="setGender(${u.id},'${esc(u.name)}','여성')">여</button>
          <button class="b ${!g?'on':''}" onclick="setGender(${u.id},'${esc(u.name)}','')">—</button>
          <button class="b" onclick="pushTest(${u.id},'${esc(u.name)}')" title="시험 알림">🔔</button>
        </div></div>`;}).join('') : `<div class="empty">${UQ?'찾는 회원이 없어요':'회원이 없어요'}</div>`}
    </div>
    <div class="note">삭제는 회원을 눌러 들어간 곳에 있어요 · 목록에서는 실수로 눌릴 수 있어 뺐어요</div>`);
}

/* ── 클럽 ── */
async function drawClubs(){
  const rows=await api('/admin/clubs');
  $('app').innerHTML=shell(`<div class="card">${rows.length? rows.map(c=>`
    <div class="rw"><div class="nm"><b>${esc(c.name)}<span class="tag">${esc(c.sport||'')}</span></b>
      <span>#${c.id} · ${esc(c.region||'지역 없음')} · 회원 ${c.members}명${
        c.owner?` · 회장 ${esc(c.owner.name)}`:''}</span></div>
      <button class="b dz" onclick="delClub(${c.id},'${esc(c.name)}')">삭제</button></div>`).join('')
    : `<div class="empty">클럽이 없어요</div>`}</div>`);
}

/* ── 매치 ── 오픈매치와 인원 미달을 한 화면에서 */
async function drawMatches(){
  const sub=SUB||'oms';
  const tabs=[['oms','오픈매치'],['under','인원 미달']];
  if(sub==='under'){
    const rows=await api('/admin/underfilled').catch(()=>[]);
    $('app').innerHTML=shell(subTabs(tabs)+`<div class="card">${rows.length? rows.map(m=>`
      <div class="rw"><div class="nm"><b>${esc(m.title||m.venue||'매치')}</b>
        <span>${esc(m.date||'')} · ${m.joined||0}/${m.capacity||0}명</span></div>
        <span class="b">${(m.capacity||0)-(m.joined||0)}명 부족</span></div>`).join('')
      : `<div class="empty">인원이 모자란 매치가 없어요</div>`}</div>`);
    return;
  }
  const rows=await api('/admin/open-matches');
  $('app').innerHTML=shell(subTabs(tabs)+`
    <div class="card">${rows.length? rows.map(m=>`
      <div class="rw" onclick="SEL=${m.id};render()" style="cursor:pointer">
        <div class="nm"><b>${esc(m.title||m.venue||'매치')}${SEL===m.id?'<span class="tag o">선택됨</span>':''}</b>
          <span>${esc(m.date||'')} · ${m.joined||0}/${m.capacity||0}명 · #${m.id}</span></div>
        <span class="b">${SEL===m.id?'봇 추가 ▾':'고르기'}</span></div>`).join('')
      : `<div class="empty">오픈매치가 없어요</div>`}</div>
    ${SEL?`<div class="card flat"><div class="ct">봇 추가</div>
      <div id="botRows"></div>
      <div style="display:flex;gap:var(--s2);margin-top:var(--s3)">
        <button class="b" onclick="addBotRow()">＋ 인원</button>
        <button class="b on" onclick="addBots()" style="flex:1">추가하기</button></div>
      <div class="note">이름·성별·구력을 넣으면 그 실력으로 매치에 들어가요</div></div>`:''}`);
  if(SEL) addBotRow();
}
function addBotRow(){
  const host=$('botRows'); if(!host) return;
  const d=document.createElement('div');
  d.style.cssText='display:flex;gap:var(--s2);margin-top:var(--s2)';
  d.innerHTML=`<input class="bn" placeholder="이름" style="flex:1;border:1px solid var(--line);
      border-radius:10px;padding:8px 10px;font-size:var(--t2);font-family:inherit;font-weight:500">
    <select class="bg" style="border:1px solid var(--line);border-radius:10px;padding:8px;
      font-size:var(--t1);font-family:inherit"><option>남성</option><option>여성</option></select>
    <select class="br" style="border:1px solid var(--line);border-radius:10px;padding:8px;
      font-size:var(--t1);font-family:inherit">
      <option value="1" data-r="950">1년</option><option value="3" data-r="1050">3년</option>
      <option value="7" data-r="1150">7년</option><option value="15" data-r="1250">15년</option></select>`;
  host.appendChild(d);
}

/* ── 구장 ── 넷을 한 화면 안쪽 탭으로 */
async function drawVenues(){
  const sub=SUB||'list';
  /* 바깥 탭이 이미 <구장>이라 안쪽 첫 칸은 <목록>으로 둔다 — 같은 말이 두 번 보이면 헷갈린다 */
  const tabs=[['list','목록'],['book','예약'],['slots','열린 시간'],['pay','정산']];
  const ep={list:'/admin/venues', book:'/admin/venue-bookings',
            slots:'/admin/venue-slots', pay:'/admin/venue-payouts/by-venue'}[sub];
  const rows=await api(ep).catch(()=>[]);
  const line=r=>{
    if(sub==='list') return [`${esc(r.name)}`,
      `#${r.id} · ${esc([r.sido,r.sigungu].filter(Boolean).join(' ')||r.addr||'주소 없음')} · 코트 ${(r.courts||[]).length}면`, ''];
    if(sub==='book') return [`${esc(r.venue_name||r.venue||'구장')}`,
      `${esc(r.date||'')} ${esc(r.start||'')} · ${esc(r.user_name||'')} · ${fmt(r.amount)}원`, r.status||''];
    if(sub==='slots') return [`${esc(r.venue_name||r.venue||'구장')}`,
      `${esc(r.date||'')} ${esc(r.start||'')}~${esc(r.end||'')} · ${r.court||''}번 코트`, r.open?'열림':'닫힘'];
    return [`${esc(r.venue_name||r.name||'구장')}`, `건수 ${r.count||0} · 정산 대기`, `${fmt(r.amount)}원`];
  };
  /* 구장은 목록만 보여주고 고칠 길이 없었다 — 이름·주소·전화를 여기서 바로 고친다.
     서버에 PATCH /admin/venues/:id 가 이미 있는데 화면이 안 쓰고 있었다. */
  const editable = (sub==='list');
  $('app').innerHTML=shell(subTabs(tabs)+
    (editable?`<div class="card flat"><div class="ct">구장 추가</div>
      <div style="display:flex;gap:var(--s2);margin-top:var(--s2)">
        <input id="vn" placeholder="구장 이름" style="flex:1;border:1px solid var(--line);border-radius:10px;
          padding:8px 10px;font-size:var(--t2);font-family:inherit;font-weight:500">
        <button class="b on" onclick="addVenue()">추가</button></div></div>`:'')+
    `<div class="card">${rows.length? rows.map(r=>{
      const [a,b,c]=line(r);
      return `<div class="rw"><div class="nm"><b>${a}</b><span>${b}</span></div>
        ${editable?`<button class="b" onclick="editVenue(${r.id})">수정</button>`
                  :(c?`<span class="b">${esc(c)}</span>`:'')}</div>`;}).join('')
      : `<div class="empty">아직 없어요</div>`}</div>`);
  CACHE.venues=rows;
}
async function addVenue(){
  const name=(($('vn')||{}).value||'').trim();
  if(!name){ toast('구장 이름을 넣어주세요'); return; }
  try{ await api('/admin/venues',{method:'POST',body:JSON.stringify({name})});
    toast('추가했어요'); render(); }
  catch(e){ toast('추가하지 못했어요'); }
}
/* 한 줄씩 물어보는 대신 값을 미리 채워 보여준다 — 비워 두면 그대로 둔다 */
async function editVenue(id){
  const v=(CACHE.venues||[]).find(x=>x.id===id); if(!v) return;
  const name=prompt('구장 이름', v.name||''); if(name===null) return;
  const addr=prompt('주소', v.addr||''); if(addr===null) return;
  const phone=prompt('전화', v.phone||''); if(phone===null) return;
  try{ await api('/admin/venues/'+id,{method:'PATCH',
      body:JSON.stringify({name:name.trim(), addr:addr.trim(), phone:phone.trim()})});
    toast('고쳤어요'); render(); }
  catch(e){ toast('고치지 못했어요'); }
}

/* ── 신고 ── */
async function drawReports(){
  const rows=await api('/admin/reports');
  $('app').innerHTML=shell(`<div class="card">${rows.length? rows.map(r=>`
    <div class="rw"><div class="nm"><b>${esc(r.reason||'신고')}<span class="tag">${esc(r.target_type||'')}</span></b>
      <span>${esc((r.target&&r.target.title)||'')} · ${ymd(r.created_at)}</span></div>
      <div class="seg3">
        <button class="b dz" onclick="resolveRep(${r.id},'hide')">숨기기</button>
        <button class="b" onclick="resolveRep(${r.id},'dismiss')">반려</button></div></div>`).join('')
    : `<div class="empty">처리할 신고가 없어요</div>`}</div>`);
}

/* ── 정산 ── */
async function drawPayouts(){
  const rows=await api('/admin/payouts').catch(()=>[]);
  $('app').innerHTML=shell(`<div class="card">${rows.length? rows.map(p=>`
    <div class="rw"><div class="nm"><b>${esc(p.name||p.manager_name||'매니저')}</b>
      <span>${ymd(p.created_at)} · ${esc(p.status||'')}</span></div>
      <span class="b">${fmt(p.amount)}원</span></div>`).join('')
    : `<div class="empty">정산할 건이 없어요</div>`}</div>`);
}

/* ── 계정 ── 스태프·매니저·구장 계정을 한 화면에서 */
async function drawStaff(){
  const sub=SUB||'staff';
  const tabs=[['staff','스태프'],['mgrs','매니저'],['venue','구장 계정']];
  const ep={staff:'/admin/staff-accounts', mgrs:'/admin/managers', venue:'/admin/venue-accounts'}[sub];
  const rows=await api(ep).catch(()=>[]);
  $('app').innerHTML=shell(subTabs(tabs)+`<div class="card">${rows.length? rows.map(a=>`
    <div class="rw"><div class="nm"><b>${esc(a.name||a.login||a.email||'계정')}
      ${a.grade?`<span class="tag">${esc(a.grade)}</span>`:''}</b>
      <span>${esc(a.role||a.venue_name||'')} ${a.created_at?('· '+ymd(a.created_at)):''}</span></div></div>`).join('')
    : `<div class="empty">계정이 없어요</div>`}</div>`);
}

/* ── 배너 ──
   배너는 <이미지>가 본체다(image·link·slot·sort). 예전 화면은 글자만 늘어놓아
   무엇이 걸려 있는지 볼 수 없었고 고칠 수도 없었다. 그림을 보여주고 바로 손보게 한다. */
async function drawBanners(){
  const rows=await api('/admin/banners').catch(()=>[]);
  const SLOT={home:'홈',club:'클럽',match:'매치'};
  $('app').innerHTML=shell(`
    <div class="card flat"><div class="ct">배너 올리기</div>
      <div style="display:flex;gap:var(--s2);margin-top:var(--s2)">
        <select id="bslot" class="b" style="padding:8px 10px">
          ${Object.entries(SLOT).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
        <input id="blink" placeholder="눌렀을 때 갈 주소 (선택)"
          style="flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;
          font-size:var(--t2);font-family:inherit;font-weight:500"></div>
      <div style="display:flex;gap:var(--s2);margin-top:var(--s2)">
        <input id="bfile" type="file" accept="image/*" style="flex:1;font-size:var(--t1)">
        <button class="b on" onclick="upBanner()">올리기</button></div>
      <div class="note">3MB 까지 · 가로로 긴 이미지가 잘 맞아요</div></div>
    <div class="card">${rows.length? rows.map((b,i)=>`
      <div class="rw">
        <img src="${esc(b.image||'')}" alt="" style="width:76px;height:44px;border-radius:9px;
          object-fit:cover;background:#f4f1ea;flex:none">
        <div class="nm"><b>${esc(SLOT[b.slot]||b.slot||'홈')}<span class="tag">${i+1}번째</span></b>
          <span>${esc(b.link||'링크 없음')}</span></div>
        <div class="seg3">
          <button class="b" onclick="moveBanner(${i},-1)" ${i===0?'disabled style="opacity:.35"':''}>↑</button>
          <button class="b" onclick="moveBanner(${i},1)" ${i===rows.length-1?'disabled style="opacity:.35"':''}>↓</button>
          <button class="b dz" onclick="delBanner(${b.id})">삭제</button></div></div>`).join('')
      : `<div class="empty">걸린 배너가 없어요</div>`}</div>`);
  CACHE.banners=rows;
}
async function upBanner(){
  const f=($('bfile')||{}).files && $('bfile').files[0];
  if(!f){ toast('이미지를 골라주세요'); return; }
  if(f.size > 3*1024*1024){ toast('3MB 까지 올릴 수 있어요'); return; }
  const image=await new Promise((ok,no)=>{ const r=new FileReader();
    r.onload=()=>ok(r.result); r.onerror=()=>no(new Error('read')); r.readAsDataURL(f); });
  try{ await api('/admin/banners',{method:'POST',body:JSON.stringify({
      image, link:($('blink')||{}).value||'', slot:($('bslot')||{}).value||'home' })});
    toast('배너를 올렸어요'); render(); }
  catch(e){ toast('올리지 못했어요 · 3MB 안쪽인지 확인해 주세요'); }
}
async function moveBanner(i,d){
  const rows=(CACHE.banners||[]).slice();
  const j=i+d; if(j<0||j>=rows.length) return;
  [rows[i],rows[j]]=[rows[j],rows[i]];
  try{ await api('/admin/banners/order',{method:'PATCH',body:JSON.stringify({ids:rows.map(b=>b.id)})});
    toast('순서를 바꿨어요'); render(); }
  catch(e){ toast('바꾸지 못했어요'); }
}
async function delBanner(id){
  if(!confirm('이 배너를 내릴까요?')) return;
  try{ await api('/admin/banners/'+id,{method:'DELETE'}); toast('내렸어요'); render(); }
  catch(e){ toast('내리지 못했어요'); }
}

/* 성별을 고치면 그 사람이 낀 대진의 남복·혼복 표기가 바뀐다.
   이미 만들어진 대진표는 그대로이고, 새로 짜는 것부터 반영된다. */
/* 클럽에서 이미 정해 둔 성별을 본인 값으로 한 번에 옮긴다 —
   운영진이 채워둔 것을 관리자가 다시 47번 누를 이유가 없다. */
async function fillGender(){
  if(!confirm('클럽에서 정해 둔 성별을 회원 정보로 옮길까요?')) return;
  try{ const r=await api('/admin/users/fill-gender',{method:'POST'});
    toast(`${r.filled||0}명을 채웠어요`); render(); }
  catch(e){ toast('채우지 못했어요 · 서버를 확인해 주세요'); }
}
/* 그 회원 폰으로 시험 알림을 보낸다 — 실제로 도착하는지가 유일한 확인 방법이다 */
async function pushTest(id, name){
  try{
    const r=await api('/admin/push-test?user='+id,{method:'POST'});
    if(!r.ok) return toast(r.reason||'보내지 못했어요');
    const sent=(r.sent||[]);
    if(!sent.length) return toast(`${name} 님은 아이폰이 등록돼 있지 않아요`);
    const ok=sent.filter(x=>x.ok).length;
    if(ok) return toast(`${name} 님께 보냈어요 · 폰을 확인해 주세요`);
    const why=(sent.find(x=>x.reason)||{}).reason||'';
    toast(why==='InvalidProviderToken' ? '키 정보가 맞지 않아요 (Key ID·Team ID)'
        : why==='BadTopic' ? 'Bundle ID 가 맞지 않아요'
        : why==='Unregistered' ? '앱이 지워진 기기예요'
        : `보내지 못했어요${why?' · '+why:''}`);
  }catch(e){ toast('보내지 못했어요 · 서버를 확인해 주세요'); }
}
async function setGender(id, name, g){
  try{ await api('/admin/users/'+id+'/gender',{method:'POST',body:JSON.stringify({gender:g})});
    toast(g?`${name} · ${g}`:`${name} · 성별 지움`); render(); }
  catch(e){ toast('바꾸지 못했어요'); }
}
async function delUser(id,name){
  if(!confirm(`${name} 회원을 삭제할까요? 활동 기록까지 지워지고 되돌릴 수 없어요.`)) return;
  try{ await api('/admin/users/'+id+'?force=1',{method:'DELETE'}); toast('삭제했어요'); render(); }
  catch(e){ toast('삭제하지 못했어요'); }
}
async function delClub(id,name){
  if(!confirm(`${name} 클럽을 삭제할까요? 되돌릴 수 없어요.`)) return;
  try{ await api('/admin/clubs/'+id,{method:'DELETE'}); toast('삭제했어요'); render(); }
  catch(e){ toast('삭제하지 못했어요'); }
}
async function resolveRep(id,action){
  try{ await api('/admin/reports/'+id+'/resolve',{method:'POST',body:JSON.stringify({action})});
    toast('처리했어요'); render(); }
  catch(e){ toast('처리하지 못했어요'); }
}
async function addBots(){
  if(!SEL){ toast('매치를 먼저 골라주세요'); return; }
  const bots=[...document.querySelectorAll('#botRows > div')].map(d=>{
    const sel=d.querySelector('.br'), op=sel.options[sel.selectedIndex];
    return { name:d.querySelector('.bn').value.trim(), gender:d.querySelector('.bg').value,
             years:+sel.value, rating:+(op&&op.dataset.r||1000) };
  }).filter(b=>b.name).slice(0,20);
  if(!bots.length){ toast('이름을 입력해 주세요'); return; }
  try{ const r=await api(`/admin/open-matches/${SEL}/bots`,{method:'POST',body:JSON.stringify({bots})});
    toast(`${r.added||0}명을 추가했어요`); render(); }
  catch(e){ toast('추가하지 못했어요'); }
}
render();
</script></body></html>
