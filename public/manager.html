<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f5f0">
<title>맞수 매니저센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --ink:#1c1b18;--coral:#ec6a2e;--coral-d:#cf5418;--coral-s:#fceee4;
    --cream:#f7f5f0;--cream2:#f6f4ef;--felt:#f2f0ea;
    --gray:#6b6357;--lgray:#a8a49c;--line:#eee9e1;
    --green:#1f7d4d;--green-s:#e9f4ee;--amber:#a3721a;--amber-s:#fdf3e2;--red:#e4685d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#edecea;font-size:14px;font-weight:400;color:var(--ink);letter-spacing:-.012em;
       line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased;
       font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
       display:flex;justify-content:center}
  .app{width:100%;max-width:480px;min-height:100vh;background:var(--cream);display:flex;flex-direction:column}
  .app.login{background:#fff}
  button,input,select{font-family:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  .num{font-variant-numeric:tabular-nums}

  /* 상단 */

  @supports (-webkit-touch-callout: none){
    input:not([type=range]):not([type=checkbox]):not([type=radio]),
    select, textarea{ font-size:16px !important; }
  }
  #statusGuard{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;
    height:env(safe-area-inset-top,0px);background:var(--cream)}
  .app.login #statusGuard{background:#fff}
  .top{min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;
       padding-top:env(safe-area-inset-top,0px);
       position:sticky;top:0;background:var(--cream);z-index:5}
  .app.login .top{background:#fff}
  .top.sheet{background:#fff;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:8px}
  .logo .mk{height:24px;width:auto;aspect-ratio:834/714;display:block}
  .logo .wm{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .back{font-size:20px;color:var(--gray);font-weight:500;padding:0 10px 0 0}
  .ttl{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .top .r{font-size:12.5px;font-weight:500;color:var(--lgray)}
  .top .r.act{color:var(--coral-d);font-weight:600}

  .body{flex:1;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
  .body.form{padding:0 22px calc(24px + env(safe-area-inset-bottom))}

  /* 타이포 */
  h1{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.35;margin-top:26px}
  h2{font-size:15.5px;font-weight:700;margin:22px 4px 10px;letter-spacing:-.02em}
  h2 span{font-size:12px;color:var(--lgray);font-weight:400;margin-left:6px}
  .sub{font-size:13.5px;color:var(--gray);margin-top:9px;line-height:1.6}
  .note{font-size:12.5px;color:#98938a;margin-top:6px;line-height:1.55}
  .lbl{font-size:13px;font-weight:600;margin-bottom:7px;display:block}
  .lbl.sm{font-size:12px;font-weight:500;color:var(--gray);margin:0}

  /* 카드 */
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;
        box-shadow:0 1px 2px rgba(40,30,18,.04),0 4px 16px rgba(40,30,18,.05)}
  .card.flush{padding:3px 16px 6px}
  .card.dash{background:var(--cream2);border-style:dashed;box-shadow:none}
  .row{display:flex;align-items:center}
  .li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .divider{height:1px;background:var(--line);margin:13px 0}
  .empty{text-align:center;color:var(--lgray);font-size:13px;padding:26px 0}

  /* 히어로 */
  .hero{background:linear-gradient(145deg,#f07338,#d95a1e);border-radius:18px;padding:20px 18px 17px;
        margin:4px 0 14px;color:#fff;box-shadow:0 10px 26px rgba(207,84,24,.24)}
  .hero .k{font-size:12.5px;font-weight:500;opacity:.88}
  .hero .v{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .hero .v small{font-size:17px;font-weight:600;margin-left:1px}
  .mini{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:9px 11px}
  .mini .k{font-size:11px;opacity:.85;font-weight:500}
  .mini .v{font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}

  /* 상태 */
  .st{display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:7px;
      font-size:11px;font-weight:600;letter-spacing:-.01em;flex:none}
  .st-go{background:var(--green-s);color:var(--green)}
  .st-wait{background:var(--amber-s);color:var(--amber)}
  .st-open{background:var(--felt);color:var(--gray)}
  .money{font-weight:700;color:var(--coral-d);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  /* 버튼 */
  .btn{width:100%;height:52px;border-radius:12px;font-size:15px;font-weight:600;background:var(--coral);
       color:#fff;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;
       box-shadow:0 6px 16px rgba(236,106,46,.26)}
  .btn:disabled{background:#ece8e1;color:#b5b0a6;box-shadow:none}
  .btn.line{background:#fff;border:1.5px solid var(--coral);color:var(--coral-d);box-shadow:none}
  .btn.mini{width:auto;height:auto;padding:6px 11px;font-size:12.5px;font-weight:600;border-radius:9px;
            background:#fff;border:1px solid var(--line);color:var(--gray);box-shadow:none}
  .btn.mini.warn{color:var(--red)}
  .btn.dark{width:auto;flex:none;padding:0 20px;background:#3b342a;font-size:14px;box-shadow:none}
  .btn+.btn{margin-top:10px}

  /* 입력 */
  .fld{width:100%;height:52px;border:1px solid #e2ddd4;border-radius:12px;background:#fff;padding:0 14px;
       display:flex;align-items:center;font-size:15px;font-weight:500}
  input.fld,select.fld{appearance:none;-webkit-appearance:none}
  input.fld::placeholder{color:#bdb8ae;font-weight:400}
  .fld:focus{outline:none;border-color:var(--coral);border-width:1.5px}
  select.fld{background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b6357' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 14px center}
  .fld.time{padding:0 12px}
  .hint{font-size:12px;color:var(--lgray);margin-top:7px;display:flex;align-items:flex-start;gap:6px;line-height:1.5}
  .hint .i{width:15px;height:15px;border-radius:50%;background:var(--coral);color:#fff;font-size:10px;
           font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
  .hint.ok{color:var(--green)}.hint.ok .i{background:var(--green)}
  .fgroup{margin-top:18px}

  /* 요일 · 코트 */
  .days{display:flex;gap:6px;margin-top:13px}
  .day{flex:1;height:40px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
       display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--gray)}
  .day.on{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 4px 10px rgba(236,106,46,.28)}
  .thumb{width:46px;height:46px;border-radius:12px;flex:none;position:relative;overflow:hidden;
         background:linear-gradient(150deg,#3f9e6b,#2c7d50)}
  .thumb.clay{background:linear-gradient(150deg,#d98e57,#bf7038)}
  .thumb.in{background:linear-gradient(150deg,#7d8fa8,#586a83)}
  .thumb i{position:absolute;left:8px;right:8px;top:50%;height:2px;background:rgba(255,255,255,.75)}
  .thumb u{position:absolute;left:50%;top:7px;bottom:7px;width:2px;background:rgba(255,255,255,.5);
           transform:translateX(-50%)}
  .ck{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line);flex:none;display:flex;
      align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
  .ck.on{background:var(--coral);border-color:var(--coral)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--felt);display:flex;align-items:center;
          justify-content:center;font-size:13px;font-weight:700;color:var(--gray);flex:none}

  /* 탭바 */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f1e9df;
          box-shadow:0 -2px 18px rgba(36,26,20,.06);display:flex;justify-content:center;z-index:6}
  .tabs{width:100%;max-width:480px;height:calc(74px + env(safe-area-inset-bottom));
        padding-bottom:env(safe-area-inset-bottom);display:flex}
  .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      font-size:10.5px;font-weight:500;color:#b3ada2}
  .tb svg{stroke:#b3ada2;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tb.on{color:var(--coral-d)}.tb.on svg{stroke:var(--coral)}

  .foot{padding:16px 22px calc(20px + env(safe-area-inset-bottom));flex:none}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(14px);opacity:0;
         background:rgba(28,27,24,.94);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;
         font-weight:500;transition:.2s;pointer-events:none;z-index:60;max-width:86%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<style>
  .badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;
         font-size:11px;font-weight:600;background:var(--felt);color:var(--gray)}
  .bar{height:6px;border-radius:99px;background:var(--felt);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--coral);transition:width .3s}
  .bar.full i{background:var(--green)}
  .pill{display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:99px;
        background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--gray);
        margin:0 6px 8px 0;flex:none}
  .pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .scroller{display:flex;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;
            scrollbar-width:none}
  .scroller::-webkit-scrollbar{display:none}
  .crt{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:6px;
       border:1.5px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;
       font-size:14px;font-weight:600;color:var(--ink)}
  .crt.on{border-color:var(--coral);background:var(--coral-s)}
  .crt.lock{opacity:.55;background:#faf8ff;border-color:#e6e0f5;cursor:default}
  .ptag{background:#f0ecfa;color:#5b3fa8;font-size:11px;font-weight:800;border-radius:7px;padding:4px 9px}
  .pl{margin:7px 0 0;padding-left:17px;font-size:12.5px;color:var(--gray);line-height:1.7}
  .pl b{color:var(--purple-d);font-weight:800}
  .crt .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;
           display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
  .crt .ck.on{background:var(--coral);border-color:var(--coral)}
  .quote{background:var(--coral-s);border:1px solid #f6dcc9;border-radius:12px;padding:11px 13px;margin-top:10px}
  .warn{font-size:12.5px;color:var(--amber);background:var(--amber-s);border-radius:9px;
        padding:9px 11px;margin-top:8px;line-height:1.5;font-weight:500}
  .warn b{font-weight:800}
  .wrap{display:flex;flex-wrap:wrap;gap:0}
  .lbl2{font-size:13px;font-weight:700;margin:0 4px 8px;letter-spacing:-.02em}
  .fld.sel{flex:1;height:46px;font-size:14px;font-weight:600;min-width:0}
  .fld.sel:disabled{background:var(--felt);color:var(--lgray)}
  .photo{width:100%;height:150px;border-radius:12px;object-fit:cover;display:block;background:var(--felt);margin-bottom:12px}
  .photo.ph{display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--lgray)}
</style>
<div id="statusGuard" aria-hidden="true"></div>
<div class="app" id="app">
  <div class="top" id="top"></div>
  <div class="body" id="view"><div class="empty">불러오는 중…</div></div>
  <div class="foot" id="foot" style="display:none"></div>
</div>
<div class="tabbar" id="tabbar" style="display:none"><div class="tabs" id="tabs"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const REMOTE = 'https://matsu.up.railway.app';
const API = (location.protocol === 'http:' || location.protocol === 'https:') ? location.origin : REMOTE;
const TOKEN_KEY = 'matsu_mgr_token';
const HELP = '010-3487-5507';

const won = n => (n || 0).toLocaleString() + '원';
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const dayKo = d => ['일','월','화','수','목','금','토'][new Date(d + 'T12:00:00').getDay()];
const md = d => d ? `${+d.slice(5,7)}.${+d.slice(8,10)}` : '';
const dt = ms => { if (!ms) return ''; const d = new Date(ms).toISOString(); return `${+d.slice(5,7)}.${+d.slice(8,10)}`; };

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2400); }
function token(){ try { return localStorage.getItem(TOKEN_KEY)||''; } catch(e){ return ''; } }
function setToken(t){ try { t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY); } catch(e){} }
function logout(){ setToken(''); ME=null; OPEN=[]; MINE=[]; PAY=null; TAB='find'; drawLogin(); }

async function api(path, opt={}){
  const r = await fetch(API+path, { ...opt, headers:{ 'Content-Type':'application/json',
    ...(token()?{Authorization:'Bearer '+token()}:{}) , ...(opt.headers||{}) } });
  const t = await r.text(); let d={}; try{ d=JSON.parse(t); }catch(e){}
  if (!r.ok) throw new Error(d.message || d.error || ('HTTP '+r.status));
  return d;
}
function handle(e){
  if (/401|403|not_manager|suspended|unauthorized|토큰/i.test(e.message)) { logout(); return true; }
  toast(e.message); return false;
}

async function doLogin(){
  const id=($('l_id').value||'').trim(), pw=$('l_pw').value||'';
  if(!id||!pw){ toast('아이디와 비밀번호를 입력해 주세요'); return; }
  try{
    const d = await api('/manager/login',{method:'POST',body:JSON.stringify({login_id:id,password:pw})});
    setToken(d.token); $('app').classList.remove('login'); await load();
  }catch(e){ drawLogin(e.message); }
}

/* ═══ 데이터 ═══ */
async function load(){
  if(!token()){ drawLogin(); return; }
  try{
    ME = await api('/manager/me');
    const qs = [];
    if (SIDO) qs.push('sido=' + encodeURIComponent(SIDO));
    if (REGION) qs.push('sigungu=' + encodeURIComponent(REGION));
    OPEN = await api('/venue-slots/open' + (qs.length ? '?' + qs.join('&') : ''));
    MINE = await api('/manager/slots');
    if (TAB==='pay') PAY = await api('/manager/payouts');
  }catch(e){ if(handle(e)) return; }
  render();
}
async function setTab(t){
  TAB=t;
  if(t==='pay' && !PAY){ render(); try{ PAY=await api('/manager/payouts'); }catch(e){ if(handle(e))return; } }
  window.scrollTo(0,0); render();
}

          <div style="min-width:0;flex:1">
            <div style="font-size:15.5px;font-weight:700;letter-spacing:-.02em">${esc((s.venue&&s.venue.name)||'')}</div>
            <p class="note" style="margin-top:2px">${esc([s.venue&&s.venue.sigungu,s.venue&&s.venue.addr].filter(Boolean).join(' '))}</p>
          </div>
          <span class="badge">${s.list.length}면 비어 있음</span>
        </div>
        <div class="num" style="font-size:18px;font-weight:700;margin-top:11px;letter-spacing:-.01em">
          ${s.start} – ${s.end}
          <span style="font-size:12.5px;color:var(--lgray);font-weight:600">${s.hours}시간</span></div>
        <div style="margin-top:10px">
          ${s.list.map(x=>{ const on=SEL.has(x.id);
            if (x.holdable === false) return `<div class="crt lock">
              <span class="ck" style="border-style:dashed"></span>
              <span style="flex:1;text-align:left">${esc((x.courts||[]).map(c=>c.name).join(' · '))}</span>
              <span style="font-size:11.5px;font-weight:700;color:var(--purple-d)">파트너 우선</span></div>`;
            return `<button class="crt ${on?'on':''}" onclick="pickSlot(${x.id})">
              <span class="ck ${on?'on':''}">${on?'✓':''}</span>
              <span style="flex:1;text-align:left">${esc((x.courts||[]).map(c=>c.name).join(' · '))}</span>
              <span class="num" style="font-weight:700">${won(x.price)}</span></button>`;}).join('')}
        </div>
        ${countIn(s)>=2 ? `
          <div class="quote">
            <div class="row">
              <span style="font-size:12.5px;font-weight:700;color:var(--coral-d)">${countIn(s)}면 · 모집 ${capOf(countIn(s),s.hours)}명</span>
              <span class="num" style="margin-left:auto;font-size:15px;font-weight:800;color:var(--coral-d)">${won(sumIn(s))}</span></div>
            <p class="note" style="color:#a3714c;margin-top:2px">코트비 합계 · 참가비는 매치 만들 때 계산돼요</p>
          </div>
          <button class="btn" style="height:46px;margin-top:10px" onclick="holdMany()">${countIn(s)}면 잡고 ${capOf(countIn(s),s.hours)}명 모집</button>
        ` : countIn(s)===1 ? `
          <div class="warn" style="margin-top:10px">오픈매치는 <b>2면부터</b> 열 수 있어요.
            1면은 개인 예약으로 나가는 자리예요.</div>
          <button class="btn" style="height:46px;margin-top:10px;background:#e8e4dc;color:#b0aa9f;box-shadow:none" disabled>1면 더 골라주세요</button>
        ` : `<p class="note">2면부터 고를 수 있어요 · ${[2,3].map(n=>`${n}면 ${capOf(n,s.hours)}명`).join(' · ')}</p>`}
      </div>`).join('')}
  `).join('')
    : `<div class="card"><p class="note" style="text-align:center;margin:14px 0">
        열린 코트가 없어요${REGION?` · ${esc(REGION)}`:(SIDO?` · ${esc(SIDO)}`:'')}<br>다른 지역을 골라보세요</p></div>`}`;
}
async function hold(id){
  if(!confirm('이 코트를 잡을까요?\n잡은 뒤 오픈매치를 걸어 사람을 모으면 됩니다.\n못 채우면 반드시 놓아주세요.')) return;
  try{ await api(`/venue-slots/${id}/hold`,{method:'POST'});
    toast('코트를 잡았어요 · 내 모집에서 매치를 연결해 주세요'); TAB='mine'; await load();
  }catch(e){ handle(e); }
}

/* ═══ 내 모집 ═══ */
function hoursLeft(s){
  const t = Date.parse(`${s.date}T${s.start}:00`);
  if (isNaN(t)) return null;
  const h = Math.round((t - Date.now()) / 36e5);
  return h > 0 ? h : 0;
}
function drawMine(){
  $('view').innerHTML = `
  <h2 style="margin-top:8px">내가 잡은 코트 <span>${MINE.length}건</span></h2>
  ${MINE.length ? MINE.map(s=>{
    const m = s.match, need = m ? (m.min_cnt||m.cap||0) : 0;
    const pct = (m && need) ? Math.min(100, Math.round(m.joined/need*100)) : 0;
    const done = s.status==='booked';
    return `
    <div class="card">
      <div class="row">
        ${done?'<span class="st st-go">확정</span>':'<span class="st st-wait">모집 중</span>'}
        <span style="margin-left:auto;font-size:12px;color:var(--gray)">${esc(s.venue?.name||'')}</span>
      </div>
      <div class="num" style="font-size:18px;font-weight:700;margin-top:9px;letter-spacing:-.01em">
        ${md(s.date)} (${dayKo(s.date)}) ${s.start}–${s.end}</div>
      <p class="note" style="margin-top:2px">${esc((s.courts||[]).map(c=>c.name).join(' · '))} · 코트비 ${won(s.price)}</p>

      ${m ? `
        <div class="divider"></div>
        <div class="row"><span class="lbl sm">모집 현황</span>
          <span class="num" style="margin-left:auto;font-size:14px;font-weight:700;
            color:${m.joined>=need?'var(--green)':'var(--ink)'}">${m.joined} / ${need}명</span></div>
        <div class="bar ${m.joined>=need?'full':''}"><i style="width:${pct}%"></i></div>
        ${done ? `<p class="note">확정됐어요 · 사장님께 코트 대금이 예약됐습니다</p>`
               : (()=>{ const h = hoursLeft(s);
                   if (h === null) return `<p class="note">${need-m.joined}명 더 모이면 확정돼요</p>`;
                   if (h <= 24) return `<p class="warn">경기가 ${h}시간 뒤예요 · 지금 못 채우면
                     <b>자동으로 취소되고 참가비가 전액 환불</b>돼요</p>`;
                   if (h <= 48) return `<p class="warn">${need-m.joined}명 더 필요해요 ·
                     경기 24시간 전까지 못 채우면 자동 취소돼요 (${h}시간 남음)</p>`;
                   return `<p class="note">${need-m.joined}명 더 모이면 확정돼요</p>`; })()}
      ` : `
        <div class="divider"></div>
        <p class="note" style="margin-top:0">아직 사람을 모으지 않았어요</p>
        <button class="btn" style="height:46px;margin-top:10px" onclick="openMake(${s.id})">여기서 매치 만들기</button>
        <details style="margin-top:10px">
          <summary style="font-size:12.5px;color:var(--lgray);font-weight:500;cursor:pointer">
            맞수 앱에서 이미 만들었어요</summary>
          <div class="row" style="gap:8px;margin-top:9px">
            <input class="fld num" id="mid_${s.id}" inputmode="numeric" placeholder="매치 번호" style="flex:1;height:46px">
            <button class="btn dark" style="height:46px" onclick="linkMatch(${s.id})">연결</button>
          </div>
        </details>
      `}

      ${!done ? `<button class="btn line" style="height:44px;margin-top:10px" onclick="release(${s.id})">코트 놓기</button>` : ''}
    </div>`;
  }).join('')
  : `<div class="card"><p class="note" style="text-align:center;margin:14px 0">
      아직 잡은 코트가 없어요<br>코트 찾기에서 자리를 잡아보세요</p></div>`}`;
}
async function linkMatch(sid){
  const v = ($('mid_'+sid).value||'').trim();
  if(!v){ toast('매치 번호를 입력해 주세요'); return; }
  try{
    const d = await api(`/venue-slots/${sid}/link-match`,{method:'POST',body:JSON.stringify({match_id:+v})});
    toast(d.joined>=d.need ? '연결과 동시에 확정됐어요' : `연결했어요 · ${d.joined}/${d.need}명`);
    await load();
  }catch(e){ handle(e); }
}
async function release(id){
  const s = MINE.find(x=>x.id===id);
  const ids = s ? MINE.filter(x=>x.status==='held' && x.date===s.date && x.start===s.start
    && ((x.venue&&x.venue.name)===(s.venue&&s.venue.name))).map(x=>x.id) : [id];
  if(!confirm(`${ids.length>1?ids.length+'면을':'이 코트를'} 놓을까요?\n사장님 화면에서 다시 판매 대기로 돌아갑니다.`)) return;
  try{ await api('/venue-slots/release-many',{method:'POST',body:JSON.stringify({ids})});
    toast('놓았어요'); await load(); }
  catch(e){ handle(e); }
}

/* ═══ 매치 만들기 (코트에서 바로) ═══ */
let MAKE = null;
async function openMake(sid){
  try{ const q = await api(`/venue-slots/${sid}/quote`);
    if(!q.ok){ toast(q.message||'이 시간은 매치를 열 수 없어요'); return; }
    MAKE = { sid, q, slot: MINE.find(x=>x.id===sid) }; drawMake();
  }catch(e){ handle(e); }
}
function closeMake(){ MAKE=null; render(); }
function drawMake(){
  const { q, slot } = MAKE;
  $('tabbar').style.display='none';
  $('top').className='top sheet';
  $('top').innerHTML = `<div style="display:flex;align-items:center">
      <button class="back" onclick="closeMake()" aria-label="뒤로">‹</button>
      <span class="ttl">매치 만들기</span></div>
    <div class="logo"><svg class="mk" viewBox="0 0 834 714"><use href="#matsuMark"/></svg></div>`;
  $('view').className='body form';
  $('view').innerHTML = `
  <h1>${q.cap}명을 모아요</h1>
  <p class="sub">${esc(slot?.venue?.name||'')} · ${md(slot.date)} (${dayKo(slot.date)})
    ${slot.start}–${slot.end} · ${q.courts}면 ${q.hours}시간</p>

  <div class="card" style="margin-top:22px;background:var(--coral-s);border-color:#f6dcc9;box-shadow:none">
    <div class="row"><span style="font-size:13.5px;font-weight:600;color:var(--coral-d)">참가비 1인당</span>
      <span class="num" style="margin-left:auto;font-size:21px;font-weight:800;color:var(--coral-d);letter-spacing:-.02em">${won(q.price)}</span></div>
    <div class="divider" style="background:#f0d9c6"></div>
    <div class="row"><span class="lbl sm" style="color:#a3714c">코트비</span>
      <span class="num" style="margin-left:auto;font-size:13.5px;font-weight:600;color:#a3714c">${won(q.court_cost)}</span></div>
    <div class="row" style="margin-top:6px"><span class="lbl sm" style="color:#a3714c">내 수고비</span>
      <span class="num" style="margin-left:auto;font-size:13.5px;font-weight:600;color:#a3714c">${won(q.mgr_fee)}</span></div>
    <div class="row" style="margin-top:6px"><span style="font-size:13px;font-weight:700;color:var(--coral-d)">내가 받을 정산</span>
      <span class="num" style="margin-left:auto;font-size:15px;font-weight:800;color:var(--coral-d)">${won(q.payout)}</span></div>
    <p class="note" style="color:#a3714c">참가비는 맞수가 정해요 · 정산은 매치가 끝난 뒤 영업일 3일 내</p>
  </div>

  <div class="fgroup"><span class="lbl">경기 방식</span>
    <select class="fld" id="k_fmt"><option>복식</option><option>단식</option><option>혼복</option></select></div>
  <div class="fgroup"><span class="lbl">모집 대상</span>
    <select class="fld" id="k_gd"><option>남녀부</option><option>남자부</option><option>여자부</option></select></div>
  <div class="fgroup"><span class="lbl">안내 문구 <span style="color:var(--lgray);font-weight:400">(선택)</span></span>
    <input class="fld" id="k_note" placeholder="예: 초급 환영 · 주차 가능"></div>

  <div style="margin-top:20px;background:var(--cream);border-radius:12px;padding:15px 16px">
    <div style="font-size:13.5px;font-weight:700">${q.cap}명이 다 차면 자동으로 확정돼요</div>
    <p class="note" style="margin-top:5px">확정되면 사장님께 코트 대금이 예약되고, 매치 종료 후 정산을 받습니다.
      못 채우면 코트를 놓아주세요.</p>
  </div>`;
  $('foot').style.display='';
  $('foot').innerHTML = `<button class="btn" onclick="doMake(this)">${MAKE.q.cap}명 모집 시작</button>`;
}
async function doMake(btn){
  btn.disabled = true;
  try{
    const d = await api(`/venue-slots/${MAKE.sid}/create-match`,{method:'POST',
      body:JSON.stringify({ fmt:$('k_fmt').value, gd:$('k_gd').value, note:$('k_note').value.trim() })});
    toast(`모집을 시작했어요 · 매치 #${d.match_id}`);
    MAKE=null; TAB='mine'; await load();
  }catch(e){ btn.disabled=false; handle(e); }
}

/* ═══ 정산 ═══ */
/* 비밀번호 변경 — 계정을 받은 뒤 초기 비밀번호를 바꿀 방법이 없었다 */
async function savePw(){
  const cur=($('pwCur')||{}).value||'', a=($('pwNew')||{}).value||'', b=($('pwNew2')||{}).value||'';
  if(a.length<6) return toast('새 비밀번호는 6자 이상이어야 해요');
  if(a!==b) return toast('새 비밀번호가 서로 달라요');
  if(a===cur) return toast('지금 비밀번호와 같아요');
  try{ await api('/manager/password',{method:'POST',body:JSON.stringify({current:cur,next:a})});
    toast('비밀번호를 바꿨어요'); PAGE=null; render(); }
  catch(e){ toast(String(e.message).replace(/[{}"]/g,'').slice(0,80)); }
}
function drawPw(){
  var tb=$('tabbar'); if(tb) tb.style.display='none';
  $('view').innerHTML=
    '<div class="hd"><button class="l" onclick="PAGE=null;render()">\u2039</button><b>비밀번호 변경</b></div>'+
    '<div class="card">'+
      '<label class="lb">지금 비밀번호</label>'+
      '<input id="pwCur" type="password" class="in" autocomplete="current-password">'+
      '<label class="lb" style="margin-top:12px">새 비밀번호</label>'+
      '<input id="pwNew" type="password" class="in" autocomplete="new-password" placeholder="6자 이상">'+
      '<label class="lb" style="margin-top:12px">새 비밀번호 확인</label>'+
      '<input id="pwNew2" type="password" class="in" autocomplete="new-password">'+
      '<button class="btn coral" style="width:100%;margin-top:16px" onclick="savePw()">바꾸기</button>'+
    '</div>';
}
function drawPay(){
  if(!PAY){ $('view').innerHTML='<div class="empty">불러오는 중…</div>'; return; }
  const pend = PAY.list.filter(r=>r.status!=='paid');
  const paid = PAY.list.filter(r=>r.status==='paid');
  $('view').innerHTML = `
  <div class="hero">
    <div class="k">받을 정산</div>
    <div class="v">${(PAY.pending||0).toLocaleString()}<small>원</small></div>
    <p class="note" style="color:rgba(255,255,255,.85);margin-top:5px">${pend.length}건 · 매치 종료 후 영업일 3일 내</p>
    <div style="height:1px;background:rgba(255,255,255,.22);margin:13px 0"></div>
    <div class="row"><span style="font-size:12.5px;font-weight:500;opacity:.85">지금까지 받은 정산</span>
      <span class="num" style="margin-left:auto;font-size:16px;font-weight:700">${won(PAY.paid)}</span></div>
  </div>

  <h2>정산 예정 <span>${pend.length}건</span></h2>
  <div class="card flush">
    ${pend.length ? pend.map(r=>`
      <div class="li"><div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${esc(r.loc||'매치')}</div>
        <p class="note" style="margin-top:1px">${esc((r.dt||'').slice(0,16).replace('T',' '))}</p></div>
        <span class="num" style="font-size:14.5px;font-weight:600">${won(r.amount)}</span>
      </div>`).join('') : '<div class="empty">정산 예정이 없어요</div>'}
  </div>

  <h2>정산 완료</h2>
  <div class="card flush">
    ${paid.length ? paid.map(r=>`
      <div class="li" style="opacity:.7"><div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${esc(r.loc||'매치')}</div>
        <p class="note" style="margin-top:1px">${esc((r.dt||'').slice(0,16).replace('T',' '))}</p></div>
        <div style="text-align:right"><div class="num" style="font-size:14.5px;font-weight:600">${won(r.amount)}</div>
        <div class="num" style="font-size:11.5px;color:var(--lgray)">${dt(r.paid_at)} 입금</div></div>
      </div>`).join('') : '<div class="empty">아직 없어요</div>'}
  </div>

  <div class="card dash">
    <p class="note" style="margin:0;color:var(--gray)">정산은 수고비${
      T().tier==='partner'?' + 파트너 보너스':''}${''} · 외부 코트를 직접 빌린 경우 실비도 환급돼요.<br>문의 ${HELP}</p>
  </div>`;
}

load();
</script>
</body></html>
