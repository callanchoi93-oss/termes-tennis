<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f5f0">
<title>맞수 파트너센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --ink:#1c1b18;--coral:#ec6a2e;--coral-d:#cf5418;--coral-s:#fceee4;
    --cream:#f7f5f0;--cream2:#f6f4ef;--felt:#f2f0ea;
    --gray:#6b6357;--lgray:#a8a49c;--line:#eee9e1;
    --green:#1f7d4d;--green-s:#e9f4ee;--amber:#a3721a;--amber-s:#fdf3e2;--red:#e4685d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#edecea;font-size:14px;font-weight:400;color:var(--ink);letter-spacing:-.012em;
       line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased;
       font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
       display:flex;justify-content:center}
  .app{width:100%;max-width:480px;min-height:100vh;background:var(--cream);display:flex;flex-direction:column}
  .app.login{background:#fff}
  button,input,select{font-family:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  .num{font-variant-numeric:tabular-nums}

  /* 상단 */
  .top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none;
       position:sticky;top:0;background:var(--cream);z-index:5}
  .app.login .top{background:#fff}
  .top.sheet{background:#fff;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:8px}
  .logo .mk{height:24px;width:auto;aspect-ratio:834/714;display:block}
  .logo .wm{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .back{font-size:20px;color:var(--gray);font-weight:500;padding:0 10px 0 0}
  .ttl{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .top .r{font-size:12.5px;font-weight:500;color:var(--lgray)}
  .top .r.act{color:var(--coral-d);font-weight:600}

  .body{flex:1;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
  .body.form{padding:0 22px calc(24px + env(safe-area-inset-bottom))}

  /* 타이포 */
  h1{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.35;margin-top:26px}
  h2{font-size:15.5px;font-weight:700;margin:22px 4px 10px;letter-spacing:-.02em}
  h2 span{font-size:12px;color:var(--lgray);font-weight:400;margin-left:6px}
  .sub{font-size:13.5px;color:var(--gray);margin-top:9px;line-height:1.6}
  .note{font-size:12.5px;color:#98938a;margin-top:6px;line-height:1.55}
  .lbl{font-size:13px;font-weight:600;margin-bottom:7px;display:block}
  .lbl.sm{font-size:12px;font-weight:500;color:var(--gray);margin:0}

  /* 카드 */
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;
        box-shadow:0 1px 2px rgba(40,30,18,.04),0 4px 16px rgba(40,30,18,.05)}
  .card.flush{padding:3px 16px 6px}
  .card.dash{background:var(--cream2);border-style:dashed;box-shadow:none}
  .row{display:flex;align-items:center}
  .li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .li:last-child{border-bottom:0}
  .divider{height:1px;background:var(--line);margin:13px 0}
  .empty{text-align:center;color:var(--lgray);font-size:13px;padding:26px 0}

  /* 히어로 */
  .hero{background:linear-gradient(145deg,#f07338,#d95a1e);border-radius:18px;padding:20px 18px 17px;
        margin:4px 0 14px;color:#fff;box-shadow:0 10px 26px rgba(207,84,24,.24)}
  .hero .k{font-size:12.5px;font-weight:500;opacity:.88}
  .hero .v{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .hero .v small{font-size:17px;font-weight:600;margin-left:1px}
  .mini{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:9px 11px}
  .mini .k{font-size:11px;opacity:.85;font-weight:500}
  .mini .v{font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}

  /* 상태 */
  .st{display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:7px;
      font-size:11px;font-weight:600;letter-spacing:-.01em;flex:none}
  .st-go{background:var(--green-s);color:var(--green)}
  .st-wait{background:var(--amber-s);color:var(--amber)}
  .st-open{background:var(--felt);color:var(--gray)}
  .money{font-weight:700;color:var(--coral-d);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  /* 버튼 */
  .btn{width:100%;height:52px;border-radius:12px;font-size:15px;font-weight:600;background:var(--coral);
       color:#fff;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em;
       box-shadow:0 6px 16px rgba(236,106,46,.26)}
  .btn:disabled{background:#ece8e1;color:#b5b0a6;box-shadow:none}
  .btn.line{background:#fff;border:1.5px solid var(--coral);color:var(--coral-d);box-shadow:none}
  .btn.mini{width:auto;height:auto;padding:6px 11px;font-size:12.5px;font-weight:600;border-radius:9px;
            background:#fff;border:1px solid var(--line);color:var(--gray);box-shadow:none}
  .btn.mini.warn{color:var(--red)}
  .btn.dark{width:auto;flex:none;padding:0 20px;background:#3b342a;font-size:14px;box-shadow:none}
  .btn+.btn{margin-top:10px}

  /* 입력 */
  .fld{width:100%;height:52px;border:1px solid #e2ddd4;border-radius:12px;background:#fff;padding:0 14px;
       display:flex;align-items:center;font-size:15px;font-weight:500}
  input.fld,select.fld{appearance:none;-webkit-appearance:none}
  input.fld::placeholder{color:#bdb8ae;font-weight:400}
  .fld:focus{outline:none;border-color:var(--coral);border-width:1.5px}
  select.fld{background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b6357' stroke-width='2.2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 14px center}
  .fld.time{padding:0 12px}
  .hint{font-size:12px;color:var(--lgray);margin-top:7px;display:flex;align-items:flex-start;gap:6px;line-height:1.5}
  .hint .i{width:15px;height:15px;border-radius:50%;background:var(--coral);color:#fff;font-size:10px;
           font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
  .hint.ok{color:var(--green)}.hint.ok .i{background:var(--green)}
  .fgroup{margin-top:18px}

  /* 요일 · 코트 */
  .days{display:flex;gap:6px;margin-top:13px}
  .day{flex:1;height:40px;border-radius:12px;background:#fff;border:1.5px solid var(--line);
       display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--gray)}
  .day.on{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 4px 10px rgba(236,106,46,.28)}
  .thumb{width:46px;height:46px;border-radius:12px;flex:none;position:relative;overflow:hidden;
         background:linear-gradient(150deg,#3f9e6b,#2c7d50)}
  .thumb.clay{background:linear-gradient(150deg,#d98e57,#bf7038)}
  .thumb.in{background:linear-gradient(150deg,#7d8fa8,#586a83)}
  .thumb i{position:absolute;left:8px;right:8px;top:50%;height:2px;background:rgba(255,255,255,.75)}
  .thumb u{position:absolute;left:50%;top:7px;bottom:7px;width:2px;background:rgba(255,255,255,.5);
           transform:translateX(-50%)}
  .ck{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line);flex:none;display:flex;
      align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800}
  .ck.on{background:var(--coral);border-color:var(--coral)}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--felt);display:flex;align-items:center;
          justify-content:center;font-size:13px;font-weight:700;color:var(--gray);flex:none}

  /* 탭바 */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f1e9df;
          box-shadow:0 -2px 18px rgba(36,26,20,.06);display:flex;justify-content:center;z-index:6}
  .tabs{width:100%;max-width:480px;height:calc(74px + env(safe-area-inset-bottom));
        padding-bottom:env(safe-area-inset-bottom);display:flex}
  .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      font-size:10.5px;font-weight:500;color:#b3ada2}
  .tb svg{stroke:#b3ada2;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tb.on{color:var(--coral-d)}.tb.on svg{stroke:var(--coral)}

  .foot{padding:16px 22px calc(20px + env(safe-area-inset-bottom));flex:none}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(14px);opacity:0;
         background:rgba(28,27,24,.94);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;
         font-weight:500;transition:.2s;pointer-events:none;z-index:60;max-width:86%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<script>
const $ = id => document.getElementById(id);
/* 앱(capacitor://)에서도 항상 실서버를 본다 */
const REMOTE = 'https://matsu.up.railway.app';
const API = (location.protocol === 'http:' || location.protocol === 'https:') ? location.origin : REMOTE;
const TOKEN_KEY = 'matsu_venue_token';
const HELP = '010-3487-5507';

const won = n => (n || 0).toLocaleString() + '원';
const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const dayKo = d => ['일','월','화','수','목','금','토'][new Date(d + 'T12:00:00').getDay()];
const md = d => d ? `${+d.slice(5,7)}.${+d.slice(8,10)}` : '';
const dt = ms => { if (!ms) return ''; const d = new Date(ms).toISOString(); return `${+d.slice(5,7)}.${+d.slice(8,10)}`; };
const today = () => new Date().toISOString().slice(0, 10);
const plus = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);

let TAB = 'home', PAGE = null;           // PAGE: 'bank' | {stmt:'2026-07'} | null
let V = null, COURTS = [], SLOTS = [], PAY = null, STMTS = null, STMT = null, BANK = null;

function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400); }
function token(){ try { return localStorage.getItem(TOKEN_KEY) || ''; } catch(e){ return ''; } }
function setToken(t){ try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch(e){} }
function logout(){ setToken(''); V = null; SLOTS = []; COURTS = []; PAY = null; STMTS = null;
  STMT = null; BANK = null; TAB = 'home'; PAGE = null; drawLogin(); }

async function api(path, opt = {}){
  const r = await fetch(API + path, { ...opt, headers: { 'Content-Type':'application/json',
    ...(token() ? { Authorization: 'Bearer ' + token() } : {}), ...(opt.headers || {}) } });
  const t = await r.text(); let d = {}; try { d = JSON.parse(t); } catch(e){}
  if (!r.ok) throw new Error(d.message || d.error || ('HTTP ' + r.status));
  return d;
}
function handle(e){
  if (/401|403|not_owner|토큰|unauthorized/i.test(e.message)) { logout(); return true; }
  toast(e.message); return false;
}

/* ═══ 로그인 ═══ */
function drawLogin(msg){
  $('app').classList.add('login');
  $('tabbar').style.display = 'none'; $('foot').style.display = 'none';
  $('top').innerHTML = '';
  $('view').className = 'body form';
  $('view').innerHTML = `
  <div style="display:flex;flex-direction:column;align-items:center;margin-top:64px">
    <svg style="height:46px;width:auto;aspect-ratio:834/714" viewBox="0 0 834 714" aria-label="맞수"><use href="#matsuMark"/></svg>
    <div style="font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:14px">맞수 파트너센터</div>
    <div class="sub" style="text-align:center;margin-top:6px">코트를 열고 판매 내역을 확인하세요</div>
  </div>
  <div style="margin-top:40px">
    <input class="fld" id="l_id" type="text" placeholder="아이디" autocapitalize="none"
           autocorrect="off" spellcheck="false" autocomplete="username">
    <input class="fld" id="l_pw" type="password" placeholder="비밀번호" style="margin-top:10px"
           autocomplete="current-password">
    ${msg ? `<div class="hint" style="color:var(--red)"><span class="i" style="background:var(--red)">!</span>${esc(msg)}</div>` : ''}
    <button class="btn" style="margin-top:14px" onclick="doLogin()">로그인</button>
  </div>
  <div style="margin-top:34px;background:var(--cream);border-radius:12px;padding:16px">
    <div style="font-size:13.5px;font-weight:700">아이디는 맞수가 발급해 드려요</div>
    <div class="note" style="margin-top:5px">계약하실 때 전달드린 아이디로 로그인해 주세요.

  const go = e => { if (e.key === 'Enter') doLogin(); };

}
async function doLogin(){
  const id = ($('l_id').value || '').trim(), pw = $('l_pw').value || '';
  if (!id || !pw) { toast('아이디와 비밀번호를 입력해 주세요'); return; }
  try {
    const d = await api('/venue/login', { method:'POST', body: JSON.stringify({ login_id:id, password:pw }) });
    setToken(d.token); $('app').classList.remove('login');
    await load();
  } catch(e){ drawLogin(e.message); }
}

/* ═══ 데이터 ═══ */
async function load(){
  if (!token()) { drawLogin(); return; }
  try {
    const me = await api('/venue/me');
    if (!me.venue) { V = null; render(); return; }
    V = me.venue; COURTS = me.courts || [];
    SLOTS = await api(`/venue/slots?from=${today()}&to=${plus(42)}`);
    if (TAB === 'pay') { PAY = await api('/venue/payouts'); STMTS = await api('/venue/statements'); }
  } catch(e){ if (handle(e)) return; }
  render();
}
async function setTab(t){
  TAB = t; PAGE = null;
  if (t === 'pay' && !PAY) {
    render();
    try { PAY = await api('/venue/payouts'); STMTS = await api('/venue/statements'); }
    catch(e){ if (handle(e)) return; }
  }
  window.scrollTo(0, 0); render();
}

/* ═══ 시간 열기 ═══ */
let SEL_DAYS = new Set(), SEL_COURTS = new Set();
function toggleDay(d){ SEL_DAYS.has(d) ? SEL_DAYS.delete(d) : SEL_DAYS.add(d); drawOpen(true); }
function toggleCourt(id){ SEL_COURTS.has(id) ? SEL_COURTS.delete(id) : SEL_COURTS.add(id); drawOpen(true); }
function fval(id, dflt){ const el = $(id); return el ? el.value : dflt; }
function calcPrice(){
  const st = fval('f_start','09:00'), en = fval('f_end','12:00');
  const hrs = (+en.slice(0,2)*60 + +en.slice(3,5) - +st.slice(0,2)*60 - +st.slice(3,5)) / 60;
  if (hrs <= 0) return 0;
  let per = 0; COURTS.forEach(c => { if (SEL_COURTS.has(c.id)) per += c.price_hour || 0; });
  return Math.round(per * hrs);
}
function countTimes(){
  const weeks = +fval('f_weeks', 4);
  return SEL_DAYS.size * weeks;
}

async function openSlots(){
  const body = { weekdays: [...SEL_DAYS], weeks: +fval('f_weeks', 4),
                 start: fval('f_start','09:00'), end: fval('f_end','12:00'), court_ids: [...SEL_COURTS] };
  try {
    const d = await api('/venue/slots', { method:'POST', body: JSON.stringify(body) });
    toast(`${d.made}타임 열었어요${d.skipped ? ` · ${d.skipped}타임은 이미 있어 건너뛰었어요` : ''}`);
    SEL_DAYS = new Set(); SEL_COURTS = new Set();
    await load();
  } catch(e){ handle(e); }
}
async function closeSlot(id){
  if (!confirm('이 시간을 닫을까요?\n다른 예약이 잡혔을 때 닫아주세요.')) return;
  try { await api('/venue/slots/' + id, { method:'DELETE' }); toast('닫았어요'); await load(); }
  catch(e){ handle(e); }
}

    </select></div>

  <div class="fgroup"><span class="lbl">계좌번호</span>
    <input class="fld num" id="b_no" type="text" inputmode="numeric" placeholder="- 없이 입력해도 돼요"
           value="${esc(b.bank_no || '')}"></div>

  <div class="fgroup"><span class="lbl">예금주</span>
    <input class="fld" id="b_holder" type="text" placeholder="통장에 적힌 이름"
           value="${esc(b.bank_holder || '')}">
    <div class="hint"><span class="i">!</span>이름이 다르면 입금이 반송돼요</div></div>

  <div class="fgroup"><span class="lbl">사업자등록번호</span>
    <input class="fld num" id="b_biz" type="text" inputmode="numeric" placeholder="10자리"
           value="${esc(b.biz_no || '')}">
    <div class="hint">세금계산서 발행에 쓰여요</div></div>

  <div style="margin-top:22px;background:var(--cream);border-radius:12px;padding:15px 16px">
    <div style="font-size:13.5px;font-weight:700">입금은 매주 월요일</div>
    <p class="note" style="margin-top:5px">경기가 끝난 다음 주 월요일에 한 번에 보내드려요.
      공휴일이면 다음 영업일로 넘어갑니다.</p>
  </div>`;
  $('foot').style.display = '';
  $('foot').innerHTML = `<button class="btn" onclick="saveBank(this)">이 계좌로 저장</button>`;
}
async function saveBank(btn){
  const body = { bank_name: $('b_name').value, bank_no: $('b_no').value,
                 bank_holder: $('b_holder').value.trim(), biz_no: $('b_biz').value };
  if (!body.bank_name) { toast('은행을 선택해 주세요'); return; }
  if (!body.bank_holder) { toast('예금주를 입력해 주세요'); return; }
  btn.disabled = true;
  try {
    await api('/venue/bank', { method:'POST', body: JSON.stringify(body) });
    toast('계좌를 저장했어요');
    PAGE = null; PAY = null; STMTS = null; TAB = 'pay';
    await load();
    if (!PAY) { PAY = await api('/venue/payouts'); STMTS = await api('/venue/statements'); render(); }
  } catch(e){ btn.disabled = false; handle(e); }
}

/* ═══ 월별 명세 ═══ */
async function openStatement(ym){
  PAGE = { stmt: ym }; STMT = null; render();
  try { STMT = await api('/venue/statements/' + ym); } catch(e){ if (handle(e)) return; }
  window.scrollTo(0, 0); render();
}
function drawStatement(){
  $('tabbar').style.display = 'none';
  const ym = PAGE.stmt;
  topBack(`${ym.slice(0,4)}년 ${+ym.slice(5,7)}월 명세`,
    `<button class="r act" onclick="downloadCsv('${ym}')">내려받기</button>`);
  if (!STMT) { $('view').innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
  const paid = r => r.status === 'paid';
  $('view').innerHTML = `
  <div class="card" style="margin-top:14px">
    <div class="row"><span class="lbl sm">판매 코트</span>
      <span class="num" style="margin-left:auto;font-size:14px;font-weight:600">${STMT.times}타임</span></div>
    <div class="row" style="margin-top:9px"><span class="lbl sm">공급가액</span>
      <span class="num" style="margin-left:auto;font-size:14px;font-weight:600">${won(STMT.supply)}</span></div>
    <div class="row" style="margin-top:9px"><span class="lbl sm">부가세</span>
      <span class="num" style="margin-left:auto;font-size:14px;font-weight:600">${won(STMT.vat)}</span></div>
    <div class="divider"></div>
    <div class="row"><span style="font-size:14px;font-weight:700">합계</span>
      <span class="num" style="margin-left:auto;font-size:19px;font-weight:800;color:var(--coral-d);letter-spacing:-.02em">${won(STMT.total)}</span></div>
    <p class="note" style="margin-top:9px">세금계산서는 이 금액으로 발행해 주세요${
      STMT.vat_included ? '' : ' (코트 단가 + 부가세 별도)'}</p>
  </div>

  <h2>건별 내역 <span>${STMT.times}타임</span></h2>
  <div class="card flush">
    ${STMT.list.length ? STMT.list.map(r => `
      <div class="li"><div style="flex:1;min-width:0">
        <div class="num" style="font-size:14px;font-weight:600">${md(r.date)} (${dayKo(r.date)}) ${r.start}–${r.end}</div>
        <p class="note" style="margin-top:1px">${esc(r.courts || '')}</p></div>
        <div style="text-align:right"><div class="num" style="font-size:14.5px;font-weight:600">${won(r.amount)}</div>
        <div class="num" style="font-size:11.5px;color:${paid(r)?'var(--lgray)':'var(--coral-d)'};font-weight:600">
          ${paid(r) ? `${dt(r.paid_at)} 입금` : `${dt(r.due_at)} 예정`}</div></div>
      </div>`).join('') : '<div class="empty">내역이 없어요</div>'}
  </div>

  <div class="card dash">
    <p class="note" style="margin:0;color:var(--gray)">입금 계좌 · ${esc(STMT.venue.bank || '등록 전')}<br>문의 ${HELP}</p>
  </div>`;
}
async function downloadCsv(ym){
  try {
    const r = await fetch(`${API}/venue/statements/${ym}/csv`, { headers:{ Authorization:'Bearer ' + token() } });
    if (!r.ok) throw new Error('내려받기에 실패했어요');
    const blob = await r.blob(), url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `맞수정산-${ym}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('내려받았어요');
  } catch(e){ toast(e.message); }
}

load();
</script>
</body></html>
